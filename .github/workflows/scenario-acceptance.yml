name: Приёмка сценариев кейса

# Отдельная строгая приёмка. Зелёный quality с известными xfail не заменяет этот запуск.
on:
  workflow_dispatch:
    inputs:
      requirement:
        description: Объём обязательной приёмки
        type: choice
        options: [all, blocking]
        default: all

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.13.0"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - name: Полный HTTP-прогон и строгая проверка результата
        env:
          T07_REQUIREMENT: ${{ inputs.requirement }}
        run: |
          set +e
          uv run --no-sync python -m tests.scenarios.run --output-dir "$RUNNER_TEMP/t07" --require "$T07_REQUIREMENT"
          scenario_status=$?
          if [ -f "$RUNNER_TEMP/t07/results.md" ]; then
            cat "$RUNNER_TEMP/t07/results.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$scenario_status"
