name: Проверки Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_test
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_MODE: offline_test
      TEST_DATABASE_URL: postgresql+asyncpg://clinic:clinic_test@localhost:5432/clinic_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия 7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # версия 9.0.0
        with:
          version: "0.13.0"
          python-version: "3.11"
          enable-cache: true
      - name: Установка зафиксированных зависимостей
        run: uv sync --locked
      - name: Проверка кода
        run: uv run --no-sync ruff check .
      - name: Проверка форматирования
        run: uv run --no-sync ruff format --check .
      - name: Тесты, включая настоящий PostgreSQL
        run: uv run --no-sync pytest

  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_MODE: offline_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.13.0"
          python-version: "3.11"
          enable-cache: true
      - name: Установка с голосовыми зависимостями
        run: uv sync --locked --extra voice
      - name: Проверка загрузки библиотек голоса и Excel
        run: uv run --no-sync python -c "import numpy, onnxruntime, torch, websockets, openpyxl; from app.voice.engines import log_mel"
      - name: Проверки голосового шлюза без скачивания моделей
        run: uv run --no-sync pytest -q tests/voice
