id: M-08
title: Анализы — общие сроки и способы получения
source: разделы 2.5, 3.8, С-08; уточнение организаторов 15.10.2026 21:10
blocking: false
expected: Общий срок без идентификации и лабораторного API, каналы получения, отказ оценивать значения
covers: [С-08]

# Уточнение организаторов: статусы заказов не обязательны. Прежний диалог
# требовал вымышленного лабораторного API и сбора ФИО. Основание замены
# записано в tests/scenarios/README.md; Git хранит исходную версию.
# Запрет значений и интерпретации сохранён, добавлена проверка общих сроков.
setup:
  now: "30.09.2026 10:15"
  channel: inbound

steps:
  - say: greeting.inbound
  - patient: Хотела узнать, готовы ли анализы крови.
    intent: I-07
    say: labs.ask_type
  - patient: Общий анализ крови
    say: labs.general_terms
    forbid: [результат готов, ммоль, повышен, понижен, в норме]
  - patient: Где получить результаты анализов?
    say: labs.how_to_get
  - patient: А там всё нормально?
    intent: I-13
    needs_general_parse: true
    say: [labs.no_values, medical.boundary]
    forbid: [в норме, хорош, плох, повышен]
  - patient: Нет, спасибо.
    parse: {expect: yes_no, intent: "no"}
    say: closing.goodbye
    end: true

result:
  code: INFO_GIVEN
  stand: unchanged
