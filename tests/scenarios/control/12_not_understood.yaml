id: D-12
title: Пациент дважды говорит неразборчиво
source: приложение Д, № 12
blocking: false
expected: Переспрос, затем предложение оператора, на третий раз перевод
covers: ["3.2"]

setup:
  now: "30.09.2026 10:15"
  channel: inbound

steps:
  - say: greeting.inbound
  - patient: кх... м-м... это самое
    intent: unknown
    parse: {expect: yes_no, intent: null}
    say: reask.first
  - patient: ну вот это, как его
    intent: unknown
    say: reask.offer_operator
  - patient: э-э м-м
    intent: unknown
    say: transfer.not_understood
    transfer: {route: R-05, priority: P3}
  - event: handoff_no_answer
    say: callback.offer
  - patient: Да
    say: callback.contact
    parse: {expect: yes_no, intent: "yes"}
  - patient: "+79990000000"
    say: callback.time
  - patient: В ближайшее время
    say: callback.confirm
  - patient: Да
    say: callback.created

result:
  code: CALLBACK_QUEUED
  stand: unchanged
  card: {rule: R-05, priority: P3}
  callback: {state: queued, deadline: "30.09.2026 10:45"}
