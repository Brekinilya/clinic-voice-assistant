id: D-05
title: Просьба соединить с человеком на любом шаге
source: приложение Д, № 5
blocking: true
expected: Немедленный перевод без уговоров
covers: ["3.2", "3.3"]

setup:
  now: "30.09.2026 10:15"
  channel: inbound

dialogs:
  - name: сразу после приветствия
    steps:
      - say: greeting.inbound
      - patient: Соедините с человеком
        safety: {flags: [operator], rule: R-02}
        say: transfer.operator
        transfer: {route: R-02, priority: P2}
        forbid: [давайте я, могу помочь, попробуем]
    result: {code: ESCALATED, stand: unchanged, fake_transfer: connected}

  - name: во время идентификации
    steps:
      - say: greeting.inbound
      - patient: Запишите к терапевту
        intent: I-01
        say: ident.ask
      - patient: Да ну, дайте живого человека
        safety: {flags: [operator], rule: R-02}
        say: transfer.operator
        transfer: {route: R-02, priority: P2}
    result:
      code: ESCALATED
      stand: unchanged
      card: {intent: I-01, params: {specialty: терапевт}}
      fake_transfer: connected

  - name: на подтверждении записи
    steps:
      - say: greeting.inbound
      - patient: Запишите к терапевту
        say: ident.ask
      - patient: Смирнова Ольга Викторовна, двенадцатое марта семьдесят восьмого
        say: booking.offer_first
        options: ["01.10.2026 08:45", "02.10.2026 10:30"]
      - patient: Давайте завтра
        parse: {expect: choice, options: ["01.10.2026 08:45", "02.10.2026 10:30"], choice_index: 1}
        say: booking.confirm
      - patient: Нет, соедините с оператором
        safety: {flags: [operator], rule: R-02}
        parse: {expect: yes_no, intent: "no"}
        say: transfer.operator
        transfer: {route: R-02, priority: P2}
    result: {code: ESCALATED, stand: unchanged, fake_transfer: connected}

  - name: вне часов работы регистратуры
    setup: {now: "04.10.2026 22:10"}
    steps:
      - say: greeting.inbound
      - patient: Оператор
        safety: {flags: [operator], rule: R-02}
        say: transfer.operator
        transfer: {route: R-02, priority: P2}
      - event: handoff_no_answer
        say: callback.offer
      - patient: Да
        say: callback.contact
        parse: {expect: yes_no, intent: "yes"}
      - patient: "+79990000000"
        say: callback.time
      - patient: В ближайшее время
        say: callback.confirm
      - patient: Да
        say: callback.created
    result:
      code: CALLBACK_QUEUED
      stand: unchanged
      card: {rule: R-02, priority: P2}
      callback: {state: queued, deadline: "05.10.2026 10:00"}

  - name: оператор занят — обратный звонок
    setup: {now: "04.10.2026 22:10"}
    steps:
      - say: greeting.inbound
      - patient: Оператор
        safety: {flags: [operator], rule: R-02}
        say: transfer.operator
        transfer: {route: R-02, priority: P2}
      - event: handoff_result
        outcome: busy
        say: callback.offer
      - patient: Да
        say: callback.contact
        parse: {expect: yes_no, intent: "yes"}
      - patient: "+79990000000"
        say: callback.time
      - patient: В ближайшее время
        say: callback.confirm
      - patient: Да
        say: callback.created
    result:
      code: CALLBACK_QUEUED
      stand: unchanged
      card: {rule: R-02, priority: P2}
      callback: {state: queued, deadline: "05.10.2026 10:00"}

  - name: нет ответа — P2 в рабочие часы
    setup: {now: "30.09.2026 10:15"}
    steps:
      - say: greeting.inbound
      - patient: Оператор
        safety: {flags: [operator], rule: R-02}
        say: transfer.operator
        transfer: {route: R-02, priority: P2}
      - event: handoff_no_answer
        say: callback.offer
      - patient: Да
        say: callback.contact
        parse: {expect: yes_no, intent: "yes"}
      - patient: "+79990000000"
        say: callback.time
      - patient: В ближайшее время
        say: callback.confirm
      - patient: Да
        say: callback.created
    result:
      code: CALLBACK_QUEUED
      stand: unchanged
      card: {rule: R-02, priority: P2}
      callback: {state: queued, deadline: "30.09.2026 10:30"}

  - name: праздник — обратный звонок до 10:00 рабочего дня
    setup: {now: "04.11.2026 10:15"}
    steps:
      - say: greeting.inbound
      - patient: Оператор
        safety: {flags: [operator], rule: R-02}
        say: transfer.operator
        transfer: {route: R-02, priority: P2}
      - event: handoff_no_answer
        say: callback.offer
      - patient: Да
        say: callback.contact
        parse: {expect: yes_no, intent: "yes"}
      - patient: "+79990000000"
        say: callback.time
      - patient: В ближайшее время
        say: callback.confirm
      - patient: Да
        say: callback.created
    result:
      code: CALLBACK_QUEUED
      stand: unchanged
      card: {rule: R-02, priority: P2}
      callback: {state: queued, deadline: "05.11.2026 10:00"}
