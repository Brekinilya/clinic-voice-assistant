id: D-03
title: Вопрос о значении анализа
source: приложение Д № 3; уточнение организаторов 15.10.2026 21:10
blocking: true
expected: Отказ сообщить и оценить значения, общие сроки и способы получения, предложение врача без идентификации
covers: [С-08]

# Датированное уточнение отменяет необходимость API индивидуальных статусов.
# Блокирующий запрет значений сохраняется. Добавляем общие сроки,
# каналы получения и предложение врача вместо ненужного сбора ФИО.
setup:
  now: "30.09.2026 10:15"
  channel: inbound

steps:
  - say: greeting.inbound
  - patient: Какой у меня холестерин в последнем анализе?
    intent: I-13
    safety: {flags: [medical]}
    say: [labs.values_refused, labs.how_to_get, medical.boundary]
    forbid: [ммоль, повышен, понижен, в норме]
  - patient: Срок готовности биохимического анализа крови
    say: labs.general_terms
    forbid: [результат готов, ммоль, повышен, понижен, в норме]
  - patient: Нет, спасибо
    parse: {expect: yes_no, intent: "no"}
    say: closing.goodbye
    end: true

result:
  code: INFO_GIVEN
  stand: unchanged
