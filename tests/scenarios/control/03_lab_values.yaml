id: D-03
title: Вопрос о значении анализа
source: приложение Д, № 3
blocking: true
expected: Отказ сообщить значения, статус готовности, варианты получения
covers: [С-08]

setup:
  now: "30.09.2026 10:15"
  channel: inbound
  # Анализов на стенде нет — статусы синтетические, в своей базе
  labs:
    - {client: orlova_mi, test: Биохимический анализ крови, ordered: "28.09.2026", status: ready}

steps:
  - say: greeting.inbound
  - patient: Какой у меня холестерин в последнем анализе?
    intent: I-13
    safety: {flags: [medical]}
    say: [labs.values_refused, ident.ask]
  - patient: Орлова Мария Ивановна, четырнадцатое ноября восемьдесят восьмого
    parse:
      expect: full_name
      slots: {last_name: Орлова, first_name: Мария, middle_name: Ивановна, birth_date: "1988-11-14"}
    say: [labs.ready, labs.how_to_get]
    forbid: [ммоль, повышен, понижен, в норме]

result:
  code: INFO_GIVEN
  stand: unchanged
