; Два софтфона для демо: пациент звонит в регистратуру (100), оператор принимает переводы.
; Asterisk в контейнере: в SDP он указывает SIP_EXTERNAL_ADDRESS — адрес, по которому софтфоны
; видят компьютер с Docker (127.0.0.1 для софтфона на этом же компьютере, IP в Wi-Fi — для телефона).

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = ${SIP_EXTERNAL_ADDRESS}
external_signaling_address = ${SIP_EXTERNAL_ADDRESS}
; Внутренняя сеть Docker; всё остальное — снаружи
local_net = 172.16.0.0/12

[phone](!)
type = endpoint
context = from-phones
disallow = all
; G.722 — 16 кГц, распознаванию лучше; ulaw и alaw — если софтфон его не умеет
allow = g722,ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[patient](phone)
auth = patient
aors = patient
callerid = Пациент <patient>

[patient]
type = auth
auth_type = userpass
username = patient
password = ${SIP_PATIENT_PASSWORD}

[patient]
type = aor
max_contacts = 2
remove_existing = yes

[operator](phone)
auth = operator
aors = operator
callerid = Регистратор <operator>

[operator]
type = auth
auth_type = userpass
username = operator
password = ${SIP_OPERATOR_PASSWORD}

[operator]
type = aor
max_contacts = 2
remove_existing = yes
