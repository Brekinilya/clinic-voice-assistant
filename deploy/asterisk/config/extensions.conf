; Диалплан: звонок в регистратуру уходит в приложение ARI голосового шлюза.

[general]
static = yes
writeprotect = yes

[from-phones]
; 100 — регистратура поликлиники: разговор ведёт голосовой шлюз
exten => 100,1,NoOp(Регистратура)
 same => n,Stasis(clinic,inbound)
 same => n,Hangup()

; 200 — напрямую регистратору: проверить, что софтфон оператора звонит
exten => 200,1,Dial(PJSIP/operator,30)
 same => n,Hangup()

[test-patient]
; Проверка без софтфона: «пациент» — Local-канал, которым управляет deploy/asterisk/call_test.py
exten => s,1,Answer()
 same => n,Stasis(patient)
 same => n,Hangup()
