# Отдельная конфигурация ВМ. Из корня: docker compose --env-file .env -f deploy/vm/compose.yaml ...
name: clinic-vm
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Настройте .env перед запуском}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build:
      context: ../..
    env_file: ../../.env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      TELEPHONY_ENABLED: "false"
      # Доступ к публичной ссылке контролирует платформа; второй пароль не нужен.
      WEB_ACCESS_ENABLED: "false"
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      # Импорт запускается от UID владельца; приложение только читает индекс.
      - ../../data:/app/data
    depends_on:
      database:
        condition: service_healthy
    init: true
    restart: unless-stopped
  recovery:
    build:
      context: ../..
    env_file: ../../.env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      TELEPHONY_ENABLED: "false"
    command: ["python", "-m", "app.recovery", "watch"]
    # У исполнителя нет HTTP-сервера; его очередь проверяется через recovery status.
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy
    init: true
    restart: unless-stopped
  # Только отметки в комментариях MIS; этот обработчик не отправляет SMS.
  outbox-worker:
    build:
      context: ../..
    env_file: ../../.env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      TELEPHONY_ENABLED: "false"
    command: ["python", "-m", "app.outbox.cli", "--client-comment", "run"]
    profiles: ["outbox"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      disable: true
    init: true
    restart: unless-stopped
  # Обновитель индекса расписания: кандидат строится и проверяется рядом с рабочим
  # файлом и публикуется атомарно; приложение видит новое поколение без рестарта.
  # Книга ожидается как data/schedule.xlsx, индекс задаёт SCHEDULE_INDEX_PATH из .env.
  schedule-updater:
    # Обновитель должен иметь право создавать/переименовывать файлы в data.
    # На ВМ задать UID/GID владельца этого каталога; остальные сервисы остаются UID10001.
    user: "${SCHEDULE_UPDATER_UID:-10001}:${SCHEDULE_UPDATER_GID:-10001}"
    build:
      context: ../..
    env_file: ../../.env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      TELEPHONY_ENABLED: "false"
    volumes:
      - ../../data:/app/data
    command: ["python", "-m", "app.scheduling.cli", "refresh-loop", "--workbook", "data/schedule.xlsx"]
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy
    init: true
    restart: unless-stopped
volumes:
  postgres-data:
