# Отдельная конфигурация ВМ. Из корня: docker compose --env-file .env -f deploy/vm/compose.yaml ...
name: clinic-vm
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Настройте .env перед запуском}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build:
      context: ../..
    env_file: ../../.env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      TELEPHONY_ENABLED: "false"
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      # Импорт запускается от UID владельца; приложение только читает индекс.
      - ../../data:/app/data
    depends_on:
      database:
        condition: service_healthy
    init: true
    restart: unless-stopped
volumes:
  postgres-data:
