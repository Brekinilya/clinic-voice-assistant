# Отдельная конфигурация ВМ. Из корня: docker compose --env-file .env -f deploy/vm/compose.yaml ...
name: clinic-vm
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Настройте .env перед запуском}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build:
      context: ../..
    env_file: ../../.env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      TELEPHONY_ENABLED: "false"
      # Публичный профиль ВМ не позволяет случайно отключить вход через .env.
      WEB_ACCESS_ENABLED: "true"
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      # Импорт запускается от UID владельца; приложение только читает индекс.
      - ../../data:/app/data
    depends_on:
      database:
        condition: service_healthy
    init: true
    restart: unless-stopped
  recovery:
    build:
      context: ../..
    env_file: ../../.env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      TELEPHONY_ENABLED: "false"
    command: ["python", "-m", "app.recovery", "watch"]
    # У исполнителя нет HTTP-сервера; его очередь проверяется через recovery status.
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy
    init: true
    restart: unless-stopped
volumes:
  postgres-data:
