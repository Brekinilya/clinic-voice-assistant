# Словарь красных флагов, раздел 7.4 регламента.
# Изменения согласуются с заместителем главного врача по медицинской части (раздел 10).
#
# examples — фразы из регламента, каждая обязана срабатывать (проверяет тест).
# Шаблоны: «а|б» — любое из слов, «+» — все части в пределах окна в любом порядке,
# «=слово» — именно эта словоформа, «слово*» — по началу слова; слова пишутся в начальной форме.
# Отрицания и прошедшее время не учитываются: при сомнении флаг считается сработавшим (раздел 7.1).
# Это минимальный набор (раздел 7.4); перефразировки должен ловить и общий разбор фразы.

window: 6

red_a:
  title: Возможная угроза жизни
  route: R-01
  groups:
    heart:
      title: Сердце, грудь
      examples: [боль в груди, давит за грудиной, жжёт в груди, отдаёт в левую руку, сердечный приступ, инфаркт]
      patterns:
        - боль|болеть|давить|жечь|жжение|сдавливать|сжимать|колоть|щемить|печь + грудь|грудина|сердце
        - отдавать + рука|лопатка|челюсть
        - сердечный приступ
        - инфаркт|стенокардия

    breathing:
      title: Дыхание
      examples: [не может дышать, задыхается, синеет, хрипит, подавился]
      patterns:
        - не|трудно|тяжело|нечем + дышать|вздохнуть|дыхание
        - задыхаться|задохнуться|удушье
        - синеть|посинеть|синий
        - хрипеть
        - подавиться

    consciousness:
      title: Сознание
      examples: [потерял сознание, без сознания, не приходит в себя, не могу разбудить, упал в обморок и не встаёт]
      patterns:
        - потерять|терять|без|нет + сознание
        - не + приходить|прийти + себя
        - не + разбудить|добудиться|просыпаться|проснуться
        - обморок
        - упасть + не + вставать|встать
        - упасть|лежать + не + отвечать|реагировать|шевелиться|двигаться

    stroke:
      title: Инсульт
      examples: [перекосило лицо, отнялась рука, отнялась нога, не может говорить, речь невнятная, онемела половина тела]
      patterns:
        - перекосить
        - отняться
        # «не могу говорить» — обычно «занят», поэтому только третье лицо
        - не + =может + говорить|разговаривать|сказать
        - речь + невнятный|спутанный|нарушиться
        - язык + заплетаться
        - онеметь|неметь|онемение + половина|рука|нога|лицо|тело|сторона
        - инсульт

    seizures:
      title: Судороги
      examples: [судороги, "трясёт, не останавливается", припадок]
      patterns:
        - судорога|судорожный
        - трясти + не + останавливаться|прекращаться|проходить
        - припадок|эпилепсия|эпилептический

    bleeding:
      title: Кровотечение
      examples: [сильное кровотечение, кровь не останавливается, рвота кровью, кровь изо рта]
      patterns:
        - кровотечение
        - кровь + не + останавливаться|остановиться|прекращаться|сворачиваться
        - рвота|рвать|тошнить|кашлять + кровь
        - кровь + рот|горло
        - кровь + хлестать|хлынуть|литься|фонтан

    trauma:
      title: Травмы, отравления
      examples: [ДТП, сильно ударился головой, упал с высоты, ожог большой, отравился, выпил таблетки, проглотил химию, укусила змея]
      patterns:
        - дтп|авария
        - сбить + машина
        - удариться|ударить + голова
        - упасть + высота|балкон|крыша|окно|этаж
        - ожог|обжечься|обжечь + большой|сильный|сильно|обширный|кипяток|весь
        - отравиться|отравление|отравить
        - =выпил|=выпила|=выпили|проглотить|наглотаться + химия|таблетка|уксус|отбеливатель|средство|яд|кислота|щелочь|растворитель|бензин|батарейка|лекарство
        - змея|гадюка + укусить

    allergy:
      title: Аллергия
      examples: [отекает горло, отекает лицо, не может глотать, анафилактический шок]
      patterns:
        - отекать|отечь|отек|опухать|опухнуть|распухать|распухнуть + горло|лицо|язык|губа|шея
        - не + =может + глотать|сглотнуть
        - анафилактический|анафилаксия|квинке

    children:
      title: Дети
      examples: ["младенец вялый, не просыпается", у грудного ребёнка температура, ребёнок посинел, ребёнок проглотил]
      patterns:
        - младенец|грудной|новорожденный + вялый|просыпаться|проснуться|температура|жар
        - у + младенец|грудной|новорожденный + температура|жар
        - ребенок|дочка|сын|малыш + посинеть|синеть|синий
        - ребенок|дочка|сын|малыш + проглотить

    pregnancy:
      title: Беременность
      examples: ["беременная, кровотечение", отошли воды, сильная боль в животе при беременности, начались схватки]
      patterns:
        - беременный|беременность + кровотечение|кровь|боль|болеть
        - отойти + вода
        - схватка|роды

    self_harm:
      title: Угроза себе или другим
      examples: [не хочу жить, хочу покончить с собой, наглотался таблеток, угрожает убить]
      patterns:
        - не + хотеть|хотеться + жить
        - хотеть|хотеться + умереть
        - покончить|самоубийство|суицид|повеситься
        - вскрыть + вена
        - наглотаться
        - угрожать|грозить|грозиться + убить|зарезать|застрелить
        - убить + себя

red_b:
  title: Острое состояние без явной угрозы жизни
  route: R-11
  groups:
    acute_pain:
      title: Острая боль
      examples: [очень сильная боль, невыносимо болит живот, невыносимо болит спина, невыносимо болит голова, боль усиливается]
      patterns:
        - сильный|сильно|невыносимый|невыносимо|нестерпимый|нестерпимо|адский|ужасный|ужасно|острый|резкий|резко + боль|болеть
        - боль|болеть + усиливаться|=сильнее

    fever:
      title: Высокая температура
      examples: [температура сорок, температура не сбивается, температура третий день и хуже]
      patterns:
        - температура + сорок|40|39|тридцать девять
        - температура + не + сбиваться|снижаться|падать|опускаться|сбить|проходить
        - температура + =хуже|=выше|расти|подниматься

    worsening:
      title: Резкое ухудшение
      examples: [стало намного хуже, резко поднялось давление, "кружится голова, не могу встать"]
      patterns:
        - =хуже + стать|намного|гораздо|резко|сильно|совсем
        - давление + резко|подняться|скакнуть|подскочить|двести|200|упасть
        - кружиться + голова
        - не + =могу|=может + встать|подняться

    injury:
      title: Травма без угрозы жизни
      examples: ["подвернул ногу, распухла", порезался глубоко]
      patterns:
        - подвернуть|вывихнуть|вывих|растяжение
        - распухнуть|опухнуть + нога|рука|колено|сустав|лодыжка|палец
        - порезаться|порез + глубоко|глубокий|сильно
        - перелом
        - сломать + рука|нога|палец|кость
