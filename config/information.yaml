# Факты учебного кейса. Не подменяют приказы и актуальные справочники реальной клиники.
document: РГ-ТЕЛ-01
version: 1.0 от 25.09.2026
facts:
  clinic_name:
    source: ['2.1']
    utterances:
      - 'Полное название: Государственное бюджетное учреждение здравоохранения «Городская поликлиника номер семь».'
    patterns:
      - как|какой + называться + поликлиника|клиника
      - название + поликлиника|клиника
      - номер + поликлиника
  broad_help:
    source: ['3.2', '6']
    utterances:
      - Могу подсказать адрес и часы работы, рассказать об анализах или помочь с записью, переносом и отменой.
      - Что именно вас интересует?
    patterns:
      - что + вы|ты + мочь + рассказать + поликлиника|клиника
      - что + быть + справка|справочный + информация
      - что + вы + мочь + подсказать + поликлиника|клиника
      - что + быть + справка
      - какая + информация + быть + у вас
      - у вас + быть + справка
  holidays:
    source: ['2.2', 'С-07']
    utterances:
      - Праздничный режим устанавливается отдельным приказом. Подтверждённого праздничного графика у меня нет.
      - Уточните его у регистратора; обычный график может отличаться.
    patterns:
      - праздник|праздничный + работать|режим|график|прием|открытый
  operator_hours:
    source: ['2.2']
    utterances:
      - Операторы регистратуры работают по будням с семи до двадцати, в субботу с восьми тридцати до пятнадцати.
      - В воскресенье операторы не работают. Виртуальный помощник доступен круглосуточно.
    patterns:
      - регистратура|оператор + работать|режим|час|открывать|открываться|закрывать|закрываться|доступный
  blood_hours:
    source: ['2.2', '6.4']
    utterances:
      - 'Забор крови: по будням с семи тридцати до десяти тридцати, в субботу с девяти до одиннадцати.'
      - В воскресенье забора крови нет. Анализы сдают по направлению врача; без направления — платно.
    patterns:
      - забор крови
      - процедурный + работать|режим|час|открывать|открываться|закрывать|закрываться
      - как|когда|скольки|время + сдать|сдавать + кровь|анализ
  lab_collection:
    source: ['2.2', '6.4', 'С-08']
    utterances:
      - Результаты доступны на Госуслугах, у лечащего врача или в окне номер три.
      - Окно выдачи работает по будням с двенадцати до девятнадцати. По субботам и воскресеньям выдачи нет.
    patterns:
      - где|как + получить|забрать|посмотреть + анализ|результат
      - выдача + результат|анализ
      - окно три|окно номер три|окно 3|окно номер 3
  blood_preparation:
    source: ['6.4']
    utterances:
      - По общей памятке лаборатории кровь сдают утром натощак.
      - Подробную подготовку к вашему исследованию уточните у назначившего врача или в процедурном кабинете.
    patterns:
      - подготовиться|подготовка + кровь|анализ
      - натощак + кровь|анализ
  lab_phone:
    source: ['6.4', 'С-08']
    utterances:
      - Значения результатов анализов по телефону не сообщаются.
      - Получить результаты можно на Госуслугах, у лечащего врача или в окне номер три по будням с двенадцати до девятнадцати.
    patterns:
      - анализ|результат + телефон|продиктовать
  attachment:
    source: ['С-13', '6.6']
    utterances:
      - Для прикрепления подайте заявление на Госуслугах или в регистратуре, в окне номер один.
      - Нужны паспорт, полис обязательного медицинского страхования и СНИЛС.
      - Обычно прикрепление занимает до трёх рабочих дней. Эта справка не оформляет прикрепление.
    patterns:
      - как|где + прикрепиться|прикрепление|прикрепить
      - документ|нужно|срок|сколько + прикрепление|прикрепиться
      - хочу прикрепиться
  before_attachment:
    source: ['С-13', '6.6']
    utterances:
      - Неотложную и экстренную помощь оказывают всем. Плановый приём по обязательному медицинскому страхованию — после прикрепления или платно.
    patterns:
      - не прикрепиться|не прикрепленный + можно|прием|врач
  clinic_hours:
    source: ['2.2', '6.1']
    utterances:
      - Поликлиника работает по будням с семи тридцати до двадцати, в субботу с девяти до пятнадцати.
      - В субботу принимают дежурные терапевт и педиатр. В воскресенье поликлиника закрыта.
    patterns:
      - поликлиника|клиника|вы + работать|режим|час|открывать|открываться|закрывать|закрываться
      - режим работы
      - час + работа
      - часы + работа
      - до скольки вы
      - работаете в субботу
      - работаете в воскресенье
  doctor_schedule_unavailable:
    source: ['С-07', '2.2']
    utterances:
      - Подтверждённого графика этого врача в справочнике нет. Актуальные дни приёма уточнит регистратор.
    patterns:
      - когда + принимать|приём + хирург|врач|доктор
      - график + врач|доктор|хирург
      - расписание + врач|доктор|хирург
      - в какой + кабинет + принимать + врач|доктор|хирург
      - какой + кабинет + врач|доктор|хирург
      - кабинет + принимать + врач|доктор|хирург
  emergency_office_hours:
    source: ['2.2', '3.1', '6.1']
    utterances:
      - Кабинет неотложной помощи принимает в будни с восьми до двадцати, в субботу с девяти до пятнадцати.
      - В воскресенье и праздничные дни кабинет закрыт. При ухудшении состояния звоните 103.
    patterns:
      - когда|во сколько + работать|принимать + кабинет + неотложный помощь
      - график|режим|часы + неотложный помощь
      - время + работа + кабинет + неотложный
  dental_transfer:
    source: ['2.1', '7.1']
    utterances:
      - Позвоните по единому номеру регистратуры 700-07-07 и наберите добавочный номер два.
    patterns:
      - как + дозвониться|позвонить|соединить + стоматология|стоматолог
      - как + дозвониться|дослониться + стоматология|стоматолог
      - телефон + стоматология
  paid_transfer:
    source: ['2.1', '7.1']
    utterances:
      - Позвоните по единому номеру регистратуры 700-07-07 и наберите добавочный номер три.
    patterns:
      - как + дозвониться|позвонить|соединить + платный отделение
      - телефон + платный отделение
  waiting_time:
    source: ['2.2', '6.3', 'С-11']
    utterances:
      - По регламенту ожидание приёма специалиста — не более четырнадцати рабочих дней с направления.
      - Приём терапевта — не более суток. Если срок нарушен, могу поставить в лист ожидания.
      - Старший администратор возьмёт ситуацию на контроль.
    patterns:
      - долго + ждать|ожидать + приём|врач|очередь
      - сколько + ждать|ожидать + приём|врач|очередь
      - время ожидания + приём|врач
      - срок + ждать|ожидать + врач|приём
  online_booking:
    source: ['6.3']
    utterances:
      - Через Госуслуги можно записаться на приём. По телефону можно записаться, перенести или отменить запись круглосуточно.
    patterns:
      - как|можно + записаться + госуслуги
      - запись + через + госуслуги
  no_slots:
    source: ['6.3']
    utterances:
      - Расписание открыто на две недели и обновляется ежедневно. Свободное время пока может отсутствовать.
      - Могу поставить вас в лист ожидания, чтобы регистратура перезвонила при появлении времени.
    patterns:
      - почему + нет|не быть + талон|время|место
      - когда + появиться + талон|время|место
      - нет + талон|свободный + время
  walk_in:
    source: ['6.3', '7.4']
    utterances:
      - Без записи принимают в кабинете неотложной помощи при внезапном ухудшении состояния.
      - Для планового приёма лучше записаться. При опасном ухудшении звоните 103 или 112.
    patterns:
      - можно|как + попасть|прийти + без + запись
      - без + запись + принять|попасть
  choose_doctor:
    source: ['6.3']
    utterances:
      - Выбрать или сменить участкового врача можно не чаще одного раза в год по письменному заявлению.
      - Заявление подают в регистратуре. Смена зависит от нагрузки и согласования с заведующим.
    patterns:
      - можно + выбрать|сменить + врач|участковый
      - как + выбрать|сменить + врач|участковый
  late_for_visit:
    source: ['6.3']
    utterances:
      - Если вы опаздываете, приходите как можно скорее и сообщите регистратуре.
      - При опоздании более чем на пятнадцать минут врач может принять позже или предложить другое время.
    patterns:
      - опаздывать|опоздать + приём|врач
      - что + делать + опаздывать|опоздать + приём
  referral_required:
    source: ['5.1', '6.3']
    utterances:
      - Без направления напрямую записывают к терапевту, педиатру, ЛОРу, хирургу, офтальмологу и в кабинет профилактики.
      - К другим специалистам нужно направление или платный приём. Могу помочь подобрать доступный маршрут.
    patterns:
      - можно + к + специалист|кардиолог|невролог|эндокринолог + без + направление
      - как + попасть|записаться + к + специалист|кардиолог|невролог|эндокринолог + без + направление
      - кто + принимать|записывать + без + направление
      - специалист + без + направление
  home_visit_time:
    source: ['2.2', '6.3']
    utterances:
      - Врач приходит в течение рабочего дня, но не позднее восемнадцати часов.
      - Точное время прихода заранее не обещаю.
    patterns:
      - во сколько + прийти|придёт|приехать + врач
      - когда + прийти|придёт|приехать + врач + дом
  home_visit_late:
    source: ['2.2', '6.3']
    utterances:
      - Сегодня заявки на вызов врача на дом принимают по будням до четырнадцати часов, в субботу до двенадцати.
      - На сегодня приём заявок уже закрыт. Могу оформить запрос на завтра.
      - При ухудшении обратитесь в кабинет неотложной помощи до двадцати часов или звоните 103.
    patterns:
      - уже + поздно + врач + сегодня
      - сегодня + врач + дом + поздно
  address:
    source: ['2.1', '6.1']
    utterances:
      - 'Адрес поликлиники: улица Центральная, дом семь. В детское отделение отдельный вход с торца здания.'
    patterns:
      - ваш адрес|адрес поликлиники|адрес клиники
      - где вы находитесь
      - где вы
      - как доехать + поликлиника|клиника
      - у вас + адрес
      - как пройти + детский отделение|поликлиника
      - где находится + поликлиника|клиника
      - как пройти + детский отделение
  medicine_benefits:
    source: ['R-12']
    utterances:
      - Этот вопрос решает региональный колл-центр Минздрава, номер сто двадцать два.
    patterns:
      - где + получить + льготный + лекарство
      - льготный + лекарство + получить|обеспечение
  insurance_policy:
    source: ['R-13']
    utterances:
      - Полис оформляет страховая компания, телефон указан на полисе.
    patterns:
      - как|где + получить|оформить + новый + полис
      - оформить + полис ОМС
      - как + получить|заменить + полис
  regional_policy:
    source: ['6.6']
    utterances:
      - Полис обязательного медицинского страхования действует по всей России.
      - Чтобы получать плановую помощь здесь, оформите прикрепление по обычным правилам.
    patterns:
      - полис + другой|иной + регион
      - полис + действовать + регион
  payment:
    source: ['6.5']
    utterances:
      - Оплатить платную услугу можно в кассе платного отделения перед приёмом, наличными или картой.
    patterns:
      - как + оплатить|оплачивать|заплатить|платить
      - как + оплатить|оплачивать|заплатить|платить + услуга|приём|приём
      - где + оплатить|оплачивать|заплатить|платить + платный|услуга|приём
      - как + внести + оплату|платёж|платеж
      - как + внести + деньги
      - как + производиться + оплата
      - оплата + услуга|приём|платный
      - можно + оплатить|оплачивать|заплатить|платить|рассчитаться|рассчитываться + карта|наличные|услуга|приём
      - способ + оплатить|оплачивать|заплатить|платить|рассчитаться|оплата
  pool_certificate:
    source: ['6.5']
    utterances:
      - Справку для бассейна взрослому выдаёт участковый терапевт на приёме. Условная цена — шестьсот рублей.
      - Ребёнку такую справку оформляет педиатр. Для записи скажите, к какому врачу хотите попасть.
    patterns:
      - справка + бассейн|спортсекция|лагерь|школа
      - нужна|нужен + справка + бассейн|спортсекция|лагерь|школа
      - справка + бассейн + ребенок|детский
  fluorography:
    source: ['6.4']
    utterances:
      - Флюорографию можно проходить бесплатно по полису с пятнадцати лет, не чаще одного раза в год.
      - Уточните направление и доступное время у терапевта. Могу помочь начать запись.
    patterns:
      - как|можно + сделать|пройти + флюорография
      - флюорография + без + направление
      - киография
      - клюорография
  sick_leave:
    source: ['6.5']
    utterances:
      - Решение о выдаче или продлении больничного принимает врач после осмотра.
      - Могу помочь записаться к терапевту или оформить вызов врача на дом.
    patterns:
      - как + получить|продлить + больничный|лист
      - нужен + больничный
  record_copy:
    source: ['6.5']
    utterances:
      - Выписку или копию медицинских документов можно запросить письменно в регистратуре или на сайте.
      - Срок подготовки — до тридцати календарных дней.
    patterns:
      - нужна|нужен + копия|выписка + документ|медкарта|карта
      - как + получить + выписка|копия + медицинский документ|медкарта
  prescription:
    source: ['6.5', '7.4']
    utterances:
      - Рецепт выписывает врач после консультации. Могу помочь записаться к терапевту.
      - Информацию о наличии льготных препаратов уточняйте по телефону 122.
    patterns:
      - нужен|нужна + рецепт
      - как + получить + рецепт
      - льготный + рецепт
  tax_certificate:
    source: ['6.5']
    utterances:
      - Справку для налогового вычета можно запросить в платном отделении или через сайт.
      - Хотите, чтобы я соединил вас с платным отделением?
    patterns:
      - справка + налоговый вычет
      - налоговый + вычет + медицинский услуга
  checkup:
    source: ['6.5']
    utterances:
      - 'Диспансеризация бесплатна по полису: с восемнадцати до тридцати девяти лет раз в три года, с сорока лет ежегодно.'
      - Обратитесь в кабинет медицинской профилактики. Могу помочь начать запись.
    patterns:
      - как + пройти|сделать + диспансеризация|профосмотр
      - диспансеризация + бесплатно
  vaccination:
    source: ['6.5']
    utterances:
      - Взрослому прививку делают через терапевта. Ребёнку — после осмотра педиатра в прививочном кабинете.
      - Для записи скажите, к какому врачу хотите попасть.
    patterns:
      - как + сделать|поставить + прививка|вакцинация
      - хочу + сделать|поставить + прививка
  vaccine_availability:
    source: ['6.5']
    utterances:
      - Наличие конкретной вакцины нужно уточнить у регистратора. Я не могу подтвердить её наличие.
    patterns:
      - есть + вакцина|прививка
      - наличие + вакцина|прививка
  visit_documents:
    source: ['6.2']
    utterances:
      - На приём возьмите паспорт и полис обязательного медицинского страхования; имеющиеся результаты обследований и выписки.
      - Для ребёнка — его полис, свидетельство о рождении или паспорт, а также паспорт родителя.
    patterns:
      - что взять + прием|врач
      - документ + прием|врач
  lab_status:
    source: ['С-08', 'Контракт МИС: лабораторные заказы отсутствуют']
    utterances:
      - Чтобы ответить на вопрос о ваших результатах, назовите фамилию, имя и отчество пациента.
    patterns:
      - готовый + мой анализ|мои анализы|мой результат|мои результаты
      - сдавать|сдать + анализ|кровь + готовый|результат
      - прийти|приходить + анализ|результат
      - анализ|результат + уже готовый|уже есть
      - готовы ли анализы
  lab_terms:
    source: ['2.5']
    utterances:
      - 'Какое именно исследование вас интересует: общий анализ крови, мочи, биохимия или другое?'
    patterns:
      - срок|сколько|долго + анализ|кровь|моча|исследование|пцр|посев|гормон|гистология|цитология|коагулограмма|биохимия|глюкоза|гемоглобин
      - когда + готовый|готовить|результат + анализ|кровь|моча|исследование|пцр|посев|гормон|гистология|цитология|коагулограмма|биохимия|глюкоза|гемоглобин
  lab_unknown:
    source: ['2.5']
    utterances:
      - Для этого исследования у меня нет подтверждённого общего срока. Уточните в лаборатории или у регистратора.
  lab_values:
    source: ['3.8', '6.4', 'Уточнение организаторов 15.10.2026 21:10']
    utterances:
