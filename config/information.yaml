# Факты учебного кейса. Не подменяют приказы и актуальные справочники реальной клиники.
document: РГ-ТЕЛ-01
version: 1.0 от 25.09.2026
facts:
  holidays:
    source: ['2.2', 'С-07']
    utterances:
      - Праздничный режим устанавливается отдельным приказом. Подтверждённого праздничного графика у меня нет.
      - Уточните его у регистратора; обычный график может отличаться.
    patterns:
      - праздник|праздничный + работать|режим|график|прием|открытый
  operator_hours:
    source: ['2.2']
    utterances:
      - Операторы регистратуры работают по будням с семи до двадцати, в субботу с восьми тридцати до пятнадцати.
      - В воскресенье операторы не работают. Виртуальный помощник доступен круглосуточно.
    patterns:
      - регистратура|оператор + работать|режим|час|открывать|открываться|закрывать|закрываться|доступный
  blood_hours:
    source: ['2.2', '6.4']
    utterances:
      - 'Забор крови: по будням с семи тридцати до десяти тридцати, в субботу с девяти до одиннадцати.'
      - В воскресенье забора крови нет. Анализы сдают по направлению врача; без направления — платно.
    patterns:
      - забор крови
      - процедурный + работать|режим|час|открывать|открываться|закрывать|закрываться
      - как|когда|скольки|время + сдать|сдавать + кровь|анализ
  lab_collection:
    source: ['2.2', '6.4', 'С-08']
    utterances:
      - Результаты доступны на Госуслугах, у лечащего врача или в окне номер три.
      - Окно выдачи работает по будням с двенадцати до девятнадцати. По субботам и воскресеньям выдачи нет.
    patterns:
      - где|как + получить|забрать|посмотреть + анализ|результат
      - выдача + результат|анализ
      - окно три|окно номер три|окно 3|окно номер 3
  blood_preparation:
    source: ['6.4']
    utterances:
      - По общей памятке лаборатории кровь сдают утром натощак.
      - Подробную подготовку к вашему исследованию уточните у назначившего врача или в процедурном кабинете.
    patterns:
      - подготовиться|подготовка + кровь|анализ
      - натощак + кровь|анализ
  lab_phone:
    source: ['6.4', 'С-08']
    utterances:
      - Значения результатов анализов по телефону не сообщаются.
      - Получить результаты можно на Госуслугах, у лечащего врача или в окне номер три по будням с двенадцати до девятнадцати.
    patterns:
      - анализ|результат + телефон|продиктовать
  attachment:
    source: ['С-13', '6.6']
    utterances:
      - Для прикрепления подайте заявление на Госуслугах или в регистратуре, в окне номер один.
      - Нужны паспорт, полис обязательного медицинского страхования и СНИЛС.
      - Обычно прикрепление занимает до трёх рабочих дней. Эта справка не оформляет прикрепление.
    patterns:
      - как|где + прикрепиться|прикрепление|прикрепить
      - документ|нужно|срок|сколько + прикрепление|прикрепиться
      - хочу прикрепиться
  before_attachment:
    source: ['С-13', '6.6']
    utterances:
      - Неотложную и экстренную помощь оказывают всем. Плановый приём по обязательному медицинскому страхованию — после прикрепления или платно.
    patterns:
      - не прикрепиться|не прикрепленный + можно|прием|врач
  clinic_hours:
    source: ['2.2', '6.1']
    utterances:
      - Поликлиника работает по будням с семи тридцати до двадцати, в субботу с девяти до пятнадцати.
      - В субботу принимают дежурные терапевт и педиатр. В воскресенье поликлиника закрыта.
    patterns:
      - поликлиника|клиника|вы + работать|режим|час|открывать|открываться|закрывать|закрываться
      - режим работы
      - до скольки вы
      - работаете в субботу
      - работаете в воскресенье
  appointment_wait:
    source: ['2.3', '3.1']
    utterances:
      - Ближайший приём зависит от специальности и расписания. Назовите врача или специальность — проверю подтверждённые свободные варианты.
    patterns:
      - долго ждать + приём|прием
      - сколько ждать + приём|прием
      - когда ближайший + приём|прием
  specialty_schedule:
    source: ['С-07', 'График']
    utterances:
      - 'Хирурги принимают по будням по сменному графику: с восьми до четырнадцати или с четырнадцати до двадцати.'
      - В выходные приёма нет; точное время зависит от врача.
    patterns:
      - когда + принимать + хирург
      - график + хирург
      - расписание + хирург
      - когда + хирург + принимать
  price_unavailable:
    source: ['С-05']
    utterances:
      - Точную стоимость приёма сейчас назвать не могу. Её уточнит регистратор.
    patterns:
      - сколько + стоит + приём|прием
      - какая + цена + приём|прием
  address:
    source: ['2.1', '6.1']
    utterances:
      - 'Адрес поликлиники: улица Центральная, дом семь. В детское отделение отдельный вход с торца здания.'
    patterns:
      - ваш адрес|адрес поликлиники|адрес клиники
      - у вас + адрес
      - где вы находитесь
      - где находится клиника|поликлиника
      - как пройти + детский отделение|поликлиника
      - где находится + поликлиника|клиника
  transfer_ministry:
    source: ['R-12']
    utterances:
      - Вопросы о льготных лекарствах решает региональный колл-центр Минздрава, номер 122.
    patterns:
      - где + получить|оформить + льготный лекарство
      - льготный лекарство + получить|оформить
  transfer_insurer:
    source: ['R-13']
    utterances:
      - Полис обязательного медицинского страхования оформляет страховая компания; телефон указан на полисе.
    patterns:
      - как + получить|оформить + новый полис
      - новый полис + получить|оформить
      - полис омс + получить|оформить
  visit_documents:
    source: ['6.2']
    utterances:
      - На приём возьмите паспорт и полис обязательного медицинского страхования; имеющиеся результаты обследований и выписки.
      - Для ребёнка — его полис, свидетельство о рождении или паспорт, а также паспорт родителя.
    patterns:
      - что взять + прием|врач
      - документ + прием|врач
  lab_status:
    source: ['С-08', 'Контракт МИС: лабораторные заказы отсутствуют']
    utterances:
      - Готовность ваших анализов я сейчас проверить не могу.
      - Проверьте результаты на Госуслугах или уточните в регистратуре. Могу сообщить общий срок исследования.
    patterns:
      - готовый + мой анализ|мои анализы|мой результат|мои результаты
      - сдавать|сдать + анализ|кровь + готовый|результат
      - прийти|приходить + анализ|результат
      - анализ|результат + уже готовый|уже есть
      - готовы ли анализы
  lab_terms:
    source: ['2.5']
    utterances:
      - 'Какое именно исследование вас интересует: общий анализ крови, мочи, биохимия или другое?'
    patterns:
      - срок|сколько|долго + анализ|кровь|моча|исследование|пцр|посев|гормон|гистология|цитология|коагулограмма|биохимия|глюкоза|гемоглобин
      - когда + готовый|готовить|результат + анализ|кровь|моча|исследование|пцр|посев|гормон|гистология|цитология|коагулограмма|биохимия|глюкоза|гемоглобин
  lab_unknown:
    source: ['2.5']
    utterances:
      - Для этого исследования у меня нет подтверждённого общего срока. Уточните в лаборатории или у регистратора.
  lab_values:
    source: ['3.8', '6.4', 'Уточнение организаторов 15.10.2026 21:10']
    utterances:
      - Значений результатов я не вижу и не могу их оценивать. Обсудите их с врачом.
laboratory:
  blood_count:
    source: ['2.5']
    utterances:
      - Обычный срок общего анализа крови — один рабочий день. Это общий срок, а не подтверждение готовности ваших результатов.
    patterns: [общий анализ крови, оак]
  urine:
    source: ['2.5']
    utterances:
      - Обычный срок общего анализа мочи — один рабочий день. Это общий срок, а не подтверждение готовности ваших результатов.
    patterns: [общий анализ мочи, оам]
  biochemistry:
    source: ['2.5']
    utterances:
      - Обычный срок биохимического анализа крови — от одного до двух рабочих дней. Личную готовность я не проверяю.
    patterns: [биохимия, биохимический]
  coagulation:
    source: ['2.5']
    utterances:
      - Обычный срок коагулограммы — от одного до двух рабочих дней. Личную готовность я не проверяю.
    patterns: [коагулограмма]
  glucose:
    source: ['2.5']
    utterances:
      - Обычный срок анализа на глюкозу — от одного до двух рабочих дней. Личную готовность я не проверяю.
    patterns: [глюкоза]
  glycated_hemoglobin:
    source: ['2.5']
    utterances:
      - Обычный срок анализа на гликированный гемоглобин — от одного до двух рабочих дней. Личную готовность я не проверяю.
    patterns: [гликированный гемоглобин]
  hormones:
    source: ['2.5']
    utterances:
      - Обычный срок гормональных исследований — от трёх до пяти рабочих дней. Личную готовность я не проверяю.
    patterns: [гормон, гормональный исследование]
  pcr:
    source: ['2.5']
    utterances:
      - Обычный срок ПЦР-исследований — от двух до трёх рабочих дней. Личную готовность я не проверяю.
    patterns: [пцр, пцр-исследование]
  culture:
    source: ['2.5']
    utterances:
      - Обычный срок бактериологического посева — от пяти до семи рабочих дней. Личную готовность я не проверяю.
    patterns: [бактериологический посев, бакпосев]
  cytology:
    source: ['2.5']
    utterances:
      - Обычный срок цитологического исследования — от семи до десяти рабочих дней. Личную готовность я не проверяю.
    patterns: [цитология, цитологический исследование]
  histology:
    source: ['2.5']
    utterances:
      - Обычный срок гистологического исследования — от десяти до четырнадцати рабочих дней. Личную готовность я не проверяю.
    patterns: [гистология, гистологический исследование]
