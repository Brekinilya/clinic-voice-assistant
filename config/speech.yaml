# Как озвучивать текст реплики: только для синтеза, в текстовом канале остаётся как написано.
# Разметка Silero v5_5_ru: «+» перед ударной гласной, «*слово*» — интонационный центр вопроса.
#
# focus_intensity — сила выделения для apply_tts(intensity=…); 3 — максимум, при 4–5 модель не синтезирует.
# abbreviations — сокращение целым словом (регистр важен) → как произнести.
# stress — слово или его основа в любом регистре → с ударением; для фамилий и слов, где модель ошибается.
#   Основа подходит и к падежным формам: «Л+ебедев» — к «Лебедеву», «Лебедевым». Если ударение
#   в форме сдвигается, форму записывают отдельно — выигрывает самое длинное совпадение.
#   Сюда — после прослушивания, по одному слову.

focus_intensity: 3

abbreviations:
  SMS: эсэм+эс
  СМС: эсэм+эс
  ОМС: оэм+эс
  ДМС: дээм+эс
  УЗИ: уз+и
  ЭКГ: экаг+э
  МРТ: эмэрт+э
  КТ: кат+э
  ЛОР: лор
  ФИО: фи+о

stress: {}
