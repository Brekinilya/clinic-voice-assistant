# Приложение А регламента: как пациенты называют врачей, кабинеты, действия и время суток.
# Формат шаблонов — как в red_flags.yaml; fallback — только если не нашлось ничего конкретнее.
# examples — фразы из приложения А (и наши, где в регламенте нет), каждая обязана находиться.
#
# specialties: ключ — специальность как в справочнике врачей стенда, в нижнем регистре.
#   referral — запись только по направлению (разделы 2.3 и 6.2: «к кардиологу, неврологу,
#   эндокринологу и другим специалистам — по направлению терапевта»);
#   age — adult, child или any (раздел 2.3);
#   forms — как ассистент произносит специальность: им., род., дат., вин., твор., предл., мн. ч.

window: 4

specialties:
  терапевт:
    referral: false
    age: adult
    forms: [терапевт, терапевта, терапевту, терапевта, терапевтом, терапевте, терапевты]
    examples: [терапевт, участковый, свой врач, к врачу, к доктору, общий врач, терапевтша]
    patterns:
      - терапевт|терапевтша
      - участковый
      - свой + врач|доктор
      - общий врач|общий доктор|врач общей практики
    fallback:
      - врач|доктор

  педиатр:
    referral: false
    age: child
    forms: [педиатр, педиатра, педиатру, педиатра, педиатром, педиатре, педиатры]
    examples: [детский врач, педиатр, участковый педиатр, к врачу с ребёнком]
    patterns:
      - педиатр
      - детский врач|детский доктор
      - участковый педиатр
      - врач|доктор + ребенок|дочка|сын

  оториноларинголог:
    referral: false
    age: any
    forms: [лор, лора, лору, лора, лором, лоре, лоры]
    examples: [лор, ухо-горло-нос, ушник, отоларинголог]
    patterns:
      - лор|оториноларинголог|отоларинголог|ушник
      - ухо-горло-нос|ухо горло нос

  офтальмолог:
    referral: false
    age: any
    forms: [офтальмолог, офтальмолога, офтальмологу, офтальмолога, офтальмологом, офтальмологе, офтальмологи]
    examples: [окулист, глазной, глазник, проверить зрение]
    patterns:
      - офтальмолог|окулист|глазник|глазной
      - зрение

  акушер-гинеколог:
    referral: false
    age: any
    forms: [акушер-гинеколог, акушера-гинеколога, акушеру-гинекологу, акушера-гинеколога, акушером-гинекологом, акушере-гинекологе, акушеры-гинекологи]
    examples: [гинеколог, женский врач, в женскую консультацию]
    patterns:
      - акушер-гинеколог|гинеколог|акушер
      - женский врач|женский доктор
      - женский консультация

  стоматолог:
    referral: false
    age: any
    forms: [стоматолог, стоматолога, стоматологу, стоматолога, стоматологом, стоматологе, стоматологи]
    examples: [зубной, к зубному, дантист, зуб болит, запломбировать, зубной ортопед]
    patterns:
      - стоматолог|дантист|зубной
      - зуб|пломба|запломбировать
      - зубной ортопед|ортодонт

  хирург:
    referral: false
    age: any
    forms: [хирург, хирурга, хирургу, хирурга, хирургом, хирурге, хирурги]
    examples: [хирург, вскрыть, удалить родинку, вросший ноготь]
    patterns:
      - хирург
      - вскрыть
      - родинка
      - вросший ноготь|врасти + ноготь

  невролог:
    referral: true
    age: any
    forms: [невролог, невролога, неврологу, невролога, неврологом, неврологе, неврологи]
    examples: [невропатолог, невролог, нервный врач]
    patterns:
      - невролог|невропатолог
      - нервный врач|нервный доктор

  кардиолог:
    referral: true
    age: any
    forms: [кардиолог, кардиолога, кардиологу, кардиолога, кардиологом, кардиологе, кардиологи]
    examples: [кардиолог, сердечный врач, по сердцу]
    patterns:
      - кардиолог
      - сердечный врач|сердечный доктор
      - по сердце

  эндокринолог:
    referral: true
    age: any
    forms: [эндокринолог, эндокринолога, эндокринологу, эндокринолога, эндокринологом, эндокринологе, эндокринологи]
    examples: [эндокринолог, по щитовидке, по сахару]
    patterns:
      - эндокринолог
      - щитовидка|щитовидный
      - по сахар|диабет

  уролог:
    referral: true
    age: adult
    forms: [уролог, уролога, урологу, уролога, урологом, урологе, урологи]
    examples: [уролог, мужской врач]
    patterns:
      - уролог
      - мужской врач|мужской доктор

  гастроэнтеролог:
    referral: true
    age: adult
    forms: [гастроэнтеролог, гастроэнтеролога, гастроэнтерологу, гастроэнтеролога, гастроэнтерологом, гастроэнтерологе, гастроэнтерологи]
    examples: [гастроэнтеролог, по желудку]
    patterns:
      - гастроэнтеролог
      - по желудок

  пульмонолог:
    referral: true
    age: adult
    forms: [пульмонолог, пульмонолога, пульмонологу, пульмонолога, пульмонологом, пульмонологе, пульмонологи]
    examples: [пульмонолог]
    patterns:
      - пульмонолог

  # В регламенте нет, но есть в истории записей поликлиники.
  дерматовенеролог:
    referral: true
    age: any
    forms: [дерматовенеролог, дерматовенеролога, дерматовенерологу, дерматовенеролога, дерматовенерологом, дерматовенерологе, дерматовенерологи]
    examples: [дерматолог, к кожнику, кожный врач, венеролог]
    patterns:
      - дерматовенеролог|дерматолог|венеролог|кожник
      - кожный врач|кожный доктор
      - по кожа

  травматолог-ортопед:
    referral: true
    age: any
    forms: [травматолог-ортопед, травматолога-ортопеда, травматологу-ортопеду, травматолога-ортопеда, травматологом-ортопедом, травматологе-ортопеде, травматологи-ортопеды]
    examples: [травматолог, ортопед]
    patterns:
      - травматолог-ортопед|травматолог|ортопед

# Кабинеты и исследования без отдельного врача (приложение А.1, раздел 2.3).
services:
  процедурный кабинет:
    note: Забор крови по направлению — будни 7:30–10:30, суббота 9:00–11:00; без направления платно.
    examples: [сдать кровь, на анализы, процедурка, укол, капельница]
    patterns:
      - сдать + кровь|анализ|моча
      - на анализ
      - процедурка|процедурный
      - укол|капельница

  кабинет медицинской профилактики:
    note: Диспансеризация и профосмотр, прямая запись.
    examples: [диспансеризация, профосмотр, медосмотр бесплатный]
    patterns:
      - диспансеризация|профосмотр
      - медосмотр

  флюорография:
    note: Без направления раз в год, с 15 лет.
    examples: [флюшка, флюорография, снимок лёгких]
    patterns:
      - флюшка|флюорография
      - снимок + легкие|легкое|грудь

  кабинет неотложной помощи:
    note: Без записи, при внезапном ухудшении; перевод на доб. 4.
    examples: [неотложка, дежурный врач, без записи срочно]
    patterns:
      - неотложка|неотложный
      - дежурный врач|дежурный доктор
      - без запись + срочно

  диагностика:
    note: ЭКГ, УЗИ, рентгенография — по направлению, платно без направления.
    examples: [УЗИ, ЭКГ, рентген, сделать кардиограмму]
    patterns:
      - узи|экг|рентген|рентгенография|кардиограмма|ультразвук

# Приложение А.2. Подсказки к интенту, а не окончательное решение; «Оператор» — в flags.yaml.
actions:
  I-01:
    examples: [записаться, взять талон, талончик, номерок, попасть на приём, на когда есть]
    patterns:
      - записаться|записать
      - талон|талончик|номерок
      - попасть + прием|врач
      - на когда =есть
  I-02:
    examples: [перенести, перезаписаться, поменять время, сдвинуть, на другой день]
    patterns:
      - перенести|переносить|перезаписаться|перезаписать|сдвинуть
      - поменять|изменить + время|дата|день
      - другой день
  I-03:
    examples: [отменить, не приду, снять запись, вычеркните, не нужно уже]
    patterns:
      - отменить|отмена|вычеркнуть
      - не + прийти
      - снять + запись|талон
      - не + нужно|надо + уже
  I-05:
    examples: [вызвать врача, на дом, чтобы пришли, домой врача]
    patterns:
      - вызвать|вызов + врач|доктор|терапевт|педиатр
      - на дом
      - чтобы + =пришли|=пришел|=пришла
      - домой + врач|доктор
  I-07:
    examples: [результаты, готовы ли анализы, пришла ли кровь, "анализы пришли?"]
    patterns:
      - результат
      - анализ + готовый|прийти
      - кровь + прийти

# Приложение А.3. slots — значения параметров в тех же именах, что в intents.yaml.
day_parts:
  morning:
    slots: {time_from: "07:30", time_to: "12:00"}
    examples: [с утра, утром, на утро]
    patterns:
      - утро|утренний
  day:
    slots: {time_from: "12:00", time_to: "16:00"}
    examples: [днём, после обеда, в обед]
    patterns:
      - =днем|обед
  evening:
    slots: {time_from: "16:00", time_to: "20:00"}
    examples: [вечером, на вечер]
    patterns:
      - вечер|вечерний
  early:
    slots: {time_pref: early}
    examples: [пораньше, как можно раньше]
    patterns:
      - =пораньше
      - как можно =раньше
  late:
    slots: {time_pref: late}
    examples: [попозже, как можно позже]
    patterns:
      - =попозже
      - как можно =позже
