    examples: [детский стоматолог, детский зубной, ребёнку зуб]
    patterns:
      - детский стоматолог|детский зубной
      - стоматолог|зубной|зуб + ребенок|сын|дочь|дочка|малыш|внук|внучка

  пародонтолог:
    referral: true
    age: adult
    forms: [пародонтолог, пародонтолога, пародонтологу, пародонтолога, пародонтологом, пародонтологе, пародонтологи]
    examples: [пародонтолог, пародонтоз, к врачу по дёснам]
    patterns:
      - пародонтолог|пародонтоз|пародонтит
      - десна

# Кабинеты и исследования без отдельного врача (приложение А.1, раздел 2.3).
services:
  общий анализ крови:
    examples: [ОАК, общий анализ крови]
    patterns:
      - общий + анализ + кровь
      - оак

  УЗИ щитовидной железы:
    examples: [УЗИ щитовидки, ультразвук щитовидной железы]
    patterns:
      - узи + щитовидк*|щитовидн*
      - ультразвук + щитовидк*|щитовидн*

  процедурный кабинет:
    note: Забор крови по направлению — будни 7:30–10:30, суббота 9:00–11:00; без направления платно.
    examples: [сдать кровь, на анализы, процедурка, укол, капельница]
    patterns:
      - сдать + кровь|анализ|моча
      - на анализ
      - процедурка|процедурный
      - укол|капельница

  кабинет медицинской профилактики:
    note: Диспансеризация и профосмотр, прямая запись.
    examples: [диспансеризация, профосмотр, медосмотр бесплатный]
    patterns:
      - диспансеризация|профосмотр
      - медосмотр

  флюорография:
    note: Без направления раз в год, с 15 лет.
    examples: [флюшка, флюорография, снимок лёгких]
    patterns:
      - флюшка|флюорография
      - снимок + легкие|легкое|грудь

  кабинет неотложной помощи:
    note: Без записи, при внезапном ухудшении; перевод на доб. 4.
    examples: [неотложка, дежурный врач, без записи срочно]
    patterns:
      - неотложка|неотложный
      - дежурный врач|дежурный доктор
      - без запись + срочно

  # УЗИ — отдельный профиль врача в расписании (врач узи-диагностики)
  диагностика:
    note: ЭКГ, рентгенография — по направлению, платно без направления.
    examples: [ЭКГ, рентген, сделать кардиограмму]
    patterns:
      - экг|рентген|рентгенография|кардиограмма

# Приложение А.2 и примеры каталога (intents.yaml): по каким словам интент виден без общего разбора.
# Порядок проверки задаёт INTENT_ORDER в app/nlu/intents.py: «записана на четверг, хочу перенести» — перенос.
actions:
  I-01:
    examples: [записаться, взять талон, талончик, номерок, попасть на приём, на когда есть]
    patterns:
      - записаться|записать
      - талон|талончик|номерок
      - попасть + прием|врач
      - на прием
      - на когда =есть
  I-02:
    examples: [перенести, перезаписаться, поменять время, сдвинуть, на другой день]
    patterns:
      - перенести|переносить|перезаписаться|перезаписать|сдвинуть
      - поменять|изменить + время|дата|день
      - другой день
    # «Не переносите, просто отмените» — это отмена. Только вплотную к глаголу:
    # «не могу прийти, давайте перенесём» остаётся переносом
    except:
      - не перенести|не переносить|не надо переносить|не нужно переносить|не надо перенести|не нужно перенести
  I-03:
    examples: [отменить, не приду, снять запись, вычеркните, не нужно уже, хочу отказаться от талона, отменяйте]
    patterns:
      - отменить|отменять|отмена|вычеркнуть|отказаться
      - не прийти|не мочь прийти|не смочь прийти
      - снять + запись|талон
      - не + нужно|надо + уже
    # «Отменять ничего не будем» — отказ от отмены, а не отмена
    except:
      - не отменить|не отменять|не надо отменять|не нужно отменять|не надо отменить|не нужно отменить
      - ничего + отменить|отменять
      - не + быть + отменить|отменять
  I-04:
    examples: [на когда я записан, во сколько мне к врачу, какой кабинет, есть у меня запись, забыла когда у меня приём]
    patterns:
      - на когда + записать
      - когда|время|сколько + я + записать
      - =во =сколько + мне|я
      - какой кабинет
      - =есть + у меня + запись
      - забыть + когда|прием|запись
      - когда + у меня + прием|запись
      # «Покажите мою запись», «напомните мою запись на среду»; без «мою» — это поиск свободного
      - показать|посмотреть|напомнить|проверить + мой + запись|прием
    except:
      - принимать|работать
  I-05:
    examples: [вызвать врача, на дом, чтобы пришли, домой врача, не выходит из дома]
    patterns:
      - вызвать|вызов + врач|доктор|терапевт|педиатр
      - на дом
      - чтобы + =пришли|=пришел|=пришла
      - домой + врач|доктор|педиатр|терапевт
      - не + выходить + дом
  I-06:
    examples: [когда принимает хирург, до скольки вы работаете, работаете в субботу, график, во сколько открывается]
    patterns:
      - принимать
      - работать
      - открываться|закрываться
      - график|расписание
  I-07:
    examples: [результаты, готовы ли анализы, пришла ли кровь, "анализы пришли?", когда будут анализы]
    patterns:
      - результат
      - анализ + готовый|прийти|когда
      - кровь + прийти
  I-08:
    examples: [сколько стоит, можно платно, за деньги, работаете по ДМС, медкомиссия]
    patterns:
      - сколько + стоить
      - стоимость|цена|платно|платный|деньги|дмс|медкомиссия|медосмотр
  I-09:
    examples: [лист ожидания, запишите в очередь, позвоните когда появится время, если кто-то откажется позвоните]
    patterns:
      - лист ожидания
      - очередь
      - позвонить + появиться|освободиться|отказаться
  I-10:
    examples: [как прикрепиться, что взять на приём, справка в бассейн, полис, больничный, через Госуслуги, без записи]
    patterns:
      - прикрепиться|прикрепление|прикрепить|переехать
      - полис|справка|больничный|госуслуга|госуслуги
      - что + взять
      - без записи
      - сдать + анализ|кровь
  I-13:
    examples: [к какому врачу идти, нужно ли вызывать врача]
    patterns:
      - какой + врач + идти|обратиться|пойти
      - нужно ли|надо ли|стоит ли
  I-14:
    examples: [выписка из медкарты, звоню из страховой компании, полиция, отозвать согласие, льготные лекарства, есть ли вакцина, звоню из редакции, журналист, юридическое лицо, другая медицинская организация, запрос от организации, сложная ситуация, удалить персональные данные, копия записи телефонного разговора]
    patterns:
      - выписка|медкарта|копия
      - страховой + компания
      - полиция|сми|журналист
      - редакция
      - юридический + лицо
      - медицинский + организация
      - запрос + организация
      - сложный + ситуация
      - согласие + отозвать|персональный|данные
      - персональный + данные
      - пдн
      - удалить + персональный|данные
      - запись + телефонный + разговор
      - льготный
      - вакцина|прививка + есть|наличие

# Приложение А.3. slots — значения параметров в тех же именах, что в intents.yaml.
day_parts:
  morning:
    slots: {time_from: "07:30", time_to: "12:00"}
    examples: [с утра, утром, на утро]
    patterns:
      - утро|утренний
  day:
    slots: {time_from: "12:00", time_to: "16:00"}
    examples: [днём, после обеда, в обед]
    patterns:
      - =днем|обед
  evening:
    slots: {time_from: "16:00", time_to: "20:00"}
    examples: [вечером, на вечер]
    patterns:
      - вечер|вечерний
  early:
    slots: {time_pref: early}
    examples: [пораньше, как можно раньше]
    patterns:
      - =пораньше
      - как можно =раньше
  late:
    slots: {time_pref: late}
    examples: [попозже, как можно позже]
    patterns:
      - =попозже
      - как можно =позже
