# Реплики ассистента по регламенту. Эталон — примеры диалогов раздела 5, скрипты разделов 3, 6, 7.
# Шаблон — не больше 20 слов (раздел 3.2); тест считает слова с учётом подстановок.
# Шаблон без expect — сообщение: за ним в той же реплике идёт вопрос (например, recording.off,
# затем повтор последнего вопроса; home_visit.safety, затем ident.ask_patient).
#
# Подстановки: {имя} или {имя:форма}. Значения приходят в Reply.parts, озвучивает speech.render.
#   date   — по умолчанию «в пятницу, второго октября»; nomn — «пятница, второе октября»;
#            accs — «пятницу, второе октября» (после «на»); gent — «второго октября»;
#            short — «в пятницу», «во вторник», «завтра»; short_accs — «пятницу», «завтра» (после «на»)
#   time   — по умолчанию «в девять тридцать»; nomn — «девять тридцать»; gent — «девяти тридцати»
#   doctor — фамилия врача; full — фамилия, имя, отчество; падежи nomn, gent, datv, accs, ablt, loct
#   text, number — падежи как у doctor, у специальности ещё plur — «хирурги»; число озвучивается словами
#   options — варианты из Reply.options через запятую и «или»; options: N у шаблона — сколько их влезает
# *слово* — интонационный центр общего вопроса для синтеза, если speech.render ставит его не туда
#   («Это *временный* адрес?»); в тексте для канала звёздочек нет.
#
# Поля шаблона: text — реплика; retry — другими словами, если пациента не поняли (раздел 3.2);
# expect — какой ответ ждём (подсказка для разбора, диалог может задать свой); route — правило перевода;
# end — после реплики звонок завершается; src — откуда в регламенте.

# Тип подстановки и сколько слов она обычно занимает (для date, time и options длину считает код по форме).
parts:
  patient: {type: text, words: 2}       # имя и отчество пациента
  doctor: {type: doctor, words: 1}
  substitute: {type: doctor, words: 1}  # замещающий врач
  specialty: {type: text, words: 1}
  date: {type: date}
  old_date: {type: date}                # дата прежней записи
  next_day: {type: date}                # ближайший рабочий день
  time: {type: time}
  start: {type: time}
  end: {type: time}
  room: {type: number, words: 2}
  price: {type: number, words: 2}
  minutes: {type: number, words: 1}
  options: {type: options}
  period: {type: text, words: 2}        # «утром», «после обеда», «на следующей неделе»
  days: {type: text, words: 2}          # «по будням», «по понедельникам и средам»
  preferences: {type: text, words: 4}   # пожелания для листа ожидания: «утро, любой будний день»
  service: {type: text, words: 3}
  test: {type: text, words: 3}          # название анализа
  schedule: {type: text, words: 10}     # «Волков — с восьми до четырнадцати, Никитина — с четырнадцати до двадцати»
  summary: {type: text, words: 8}       # итоги нескольких действий в одном звонке

templates:

  # Начало разговора, раздел 3.3 и 3.4

  greeting.inbound:
    text: Здравствуйте! Регистратура поликлиники номер семь, виртуальный помощник. Разговор записывается. Чем могу помочь?
    expect: free
    src: "3.3"

  greeting.repeat_call:
    text: Здравствуйте! Регистратура поликлиники номер семь, виртуальный помощник. Разговор записывается. Вы недавно звонили — продолжим тот вопрос или у вас новый?
    expect: free
    src: "3.3"

  recording.off:
    text: Хорошо, запись разговора отключена.
    src: "3.4"

  ask.how_can_help:
    text: Чем могу помочь?
    expect: free
    src: "3.3"

  robot.answer:
    text: Да, я виртуальный помощник регистратуры. Если хотите, соединю с сотрудником.
    expect: yes_no
    src: "3.2"

  # Идентификация, раздел 3.5

  ident.ask:
    text: Назовите, пожалуйста, фамилию, имя, отчество и дату рождения.
    retry: Повторите, пожалуйста, полностью фамилию, имя, отчество и дату рождения.
    expect: full_name
    src: "3.5"

  ident.ask_child:
    text: Назовите, пожалуйста, фамилию, имя, отчество и дату рождения ребёнка.
    retry: Повторите, пожалуйста, полностью фамилию, имя, отчество и дату рождения ребёнка.
    expect: full_name
    src: С-12

  ident.ask_patient:
    text: Назовите, пожалуйста, фамилию, имя, отчество и дату рождения пациента.
    retry: Повторите, пожалуйста, полностью фамилию, имя, отчество и дату рождения пациента.
    expect: full_name
    src: С-06

  ident.ask_name:
    text: Назовите, пожалуйста, фамилию, имя и отчество.
    retry: Скажите ещё раз фамилию, имя и отчество.
    expect: full_name
    src: "3.5"

  ident.ask_birth_date:
    text: Назовите, пожалуйста, дату рождения.
    retry: Скажите дату рождения полностью — число, месяц и год.
    expect: birth_date
    src: "3.5"

  ident.not_found:
    text: Не получается найти карту по этим данным. Назовите фамилию по буквам и дату рождения.
    expect: full_name
    src: "3.5"

  ident.ask_policy:
    text: Назовите, пожалуйста, номер полиса ОМС — шестнадцать цифр. Можно ввести с клавиатуры телефона.
    expect: free
    src: "3.5"

  ident.relation:
    text: Спасибо. Кем вы приходитесь пациенту?
    expect: free
    src: С-12

  ident.under_15:
    text: Записаться самостоятельно можно с пятнадцати лет. Пусть позвонит кто-то из взрослых, например родители.
    src: "3.5"

  # Общие ситуации разговора, разделы 3.2, 3.6, 3.7

  reask.first:
    text: Простите, не удалось разобрать. Скажите, пожалуйста, другими словами.
    expect: free
    src: "3.2"

  reask.offer_operator:
    text: Похоже, я вас плохо понимаю. Соединить с сотрудником?
    expect: yes_no
    src: R-05

  confirm.retry:
    text: Ответьте, пожалуйста, да или нет.
    expect: yes_no
    src: "3.2"

  choice.retry:
    text: Какой вариант удобнее — {options}?
    options: 3
    expect: choice
    src: "3.2"

  silence.first:
    text: Вы меня слышите?
    expect: free
    src: "3.2"

  silence.final:
    text: Вас не слышно. Перезвоните, пожалуйста.
    end: true
    route: R-17
    src: "3.2"

  wait.schedule:
    text: Одну секунду, проверяю расписание.
    src: "3.7"

  wait.generic:
    text: Одну секунду, проверяю.
    src: "3.7"

  wait.mis_ready:
    text: Система записи освободилась, можно продолжать.
    src: "3.7"

  dates.confirm:
    text: На {date:accs}, верно?
    expect: yes_no
    src: "3.2"

  dates.beyond_horizon:
    text: Запись открыта на две недели вперёд, до {date:gent}. Подобрать время в эти дни?
    expect: yes_no
    src: С-01

  dates.sunday:
    text: В воскресенье поликлиника не работает. Подобрать время в другой день?
    expect: yes_no
    src: "2.2"

  closing.anything_else:
    text: Могу ещё чем-то помочь?
    expect: free
    src: "3.6"

  closing.summary:
    text: Итак, {summary}. Могу ещё чем-то помочь?
    expect: free
    src: "4"

  closing.goodbye:
    text: Всего доброго, будьте здоровы!
    end: true
    src: "3.6"

  closing.goodbye_short:
    text: Хорошо. Всего доброго!
    end: true
    src: "3.6"

  # Запись на приём, С-01

  booking.ask_specialty:
    text: К какому врачу вас записать?
    retry: Скажите, к какому специалисту нужно — например, терапевт, лор или окулист.
    expect: free
    src: С-01

  booking.offer_first:
    text: "{patient}, к {specialty:datv} {doctor:datv} есть время: {options}. Что удобнее?"
    options: 2
    expect: choice
    src: С-01

  booking.offer:
    text: Есть {options}. Что удобнее?
    options: 3
    expect: choice
    src: С-01

  booking.offer_period:
    text: "{period}: {options}. Что удобнее?"
    options: 2
    expect: choice
    src: С-01

  booking.offer_nearest:
    text: "Ближайшее время к {specialty:datv}: {options}. Что удобнее?"
    options: 2
    expect: choice
    src: С-01

  booking.no_slots_period:
    text: На это время всё занято. Могу предложить {options}.
    options: 2
    expect: choice
    src: С-01

  booking.confirm:
    text: "Записываю: {specialty} {doctor}, {date:nomn}, {time:nomn}, кабинет {room}. Верно?"
    expect: yes_no
    src: С-01

  booking.done:
    text: Готово, вы записаны. Возьмите паспорт и полис. Что-нибудь ещё?
    expect: free
    src: С-01

  # Ответы backend без неизвестного кабинета и обещания ещё не подключённой SMS.
  booking.confirm_without_room:
    text: "Записываю: {specialty} {doctor}, {date:nomn}, {time:nomn}. Верно?"
    expect: yes_no
    src: С-01

  booking.result:
    text: "Вы записаны: {specialty} {doctor}, {date:nomn}, {time:nomn}, кабинет {room}."
    expect: free
    src: С-01

  booking.result_without_room:
    text: "Вы записаны: {specialty} {doctor}, {date:nomn}, {time:nomn}."
    expect: free
    src: С-01

  booking.slot_taken:
    text: Извините, это время только что заняли. Могу предложить {options}.
    options: 2
    expect: choice
    src: С-01

  booking.already_has_visit:
    text: У вас уже есть запись к {specialty:datv} {date}. Хотите её перенести?
    expect: yes_no
    src: С-01

  booking.not_attached:
    text: По полису ОМС плановый приём доступен после прикрепления к поликлинике. Могу рассказать, как прикрепиться, или записать на платный приём.
    expect: free
    src: С-01

  booking.other_district:
    text: Запись идёт к участковому врачу вашего участка. Сменить врача можно по заявлению раз в год. Записать к {doctor:datv}?
    expect: yes_no
    src: С-01

  booking.done_child:
    text: Готово, ребёнок записан. Возьмите полис ребёнка и свой паспорт. Что-нибудь ещё?
    expect: free
    src: С-12

  booking.child_escort:
    text: Записываю. На приём ребёнка должен сопровождать законный представитель или человек с доверенностью.
    src: С-12

  # Запись по направлению, С-02

  referral.found:
    text: "{patient}, вижу ваше направление к {specialty:datv}. Ближайшее время: {options}."
    options: 2
    expect: choice
    src: С-02

  referral.missing:
    text: К {specialty:datv} запись идёт по направлению лечащего врача. Сначала нужен приём участкового терапевта. Записать вас к нему?
    expect: yes_no
    src: С-02

  referral.expired:
    text: Срок действия направления истёк. Нужно получить новое у лечащего врача. Записать к терапевту?
    expect: yes_no
    src: С-02

  referral.paper:
    text: Бумажное направление оформляет регистратор. Соединяю.
    route: R-08
    src: С-02

  referral.no_slots:
    text: Мы позвоним, как только появится время. Срок ожидания по закону — не более четырнадцати рабочих дней, мы его контролируем.
    src: С-02

  referral.done:
    text: Готово. Возьмите паспорт, полис и результаты обследований, если они есть на руках. Что-нибудь ещё?
    expect: free
    src: С-02

  # Перенос, С-03

  reschedule.found_one:
    text: "{patient}, у вас запись к {specialty:datv} {doctor:datv} {date:short} {time}. Переносим её?"
    expect: yes_no
    src: С-03

  reschedule.which:
    text: Какую запись перенести — {options}?
    options: 3
    expect: choice
    src: С-03

  reschedule.which_specialty:
    text: У вас несколько записей. Скажите, к какому врачу запись, которую переносим?
    expect: free
    src: С-03

  reschedule.offer:
    text: "{period}: {options}. Что удобнее?"
    options: 3
    expect: choice
    src: С-03

  reschedule.no_slots_doctor:
    text: У {doctor:gent} свободного времени нет. Могу записать к другому врачу или поставить в лист ожидания.
    expect: free
    src: С-03

  reschedule.confirm:
    text: Переношу на {date:accs}, {time:nomn}, кабинет {room}. Запись на {old_date:short_accs} отменяю. Верно?
    expect: yes_no
    src: С-03

  reschedule.done:
    text: Готово, запись перенесена. Что-нибудь ещё?
    expect: free
    src: С-03

  reschedule.failed:
    text: Извините, не получилось перенести. Ваша запись на {old_date:short_accs} остаётся в силе. Соединяю с регистратором.
    route: R-06
    src: С-03

  visits.none:
    text: Активных записей не найдено. Хотите записаться?
    expect: yes_no
    src: С-03

  # Отмена, С-04

  cancel.offer_reschedule:
    text: "{patient}, у вас запись к {specialty:datv} {date:short} {time}. Могу перенести вместо отмены. Перенести или отменить?"
    expect: free
    src: С-04

  cancel.which:
    text: Какую запись отменить — {options}?
    options: 3
    expect: choice
    src: С-04

  cancel.confirm:
    text: Отменяю запись к {specialty:datv} на {date:short_accs}. Верно?
    expect: yes_no
    src: С-04

  cancel.done:
    text: Готово, запись отменена. Спасибо, что предупредили — это время достанется другому пациенту. Что-нибудь ещё?
    expect: free
    src: С-04

  cancel.past:
    text: Время этой записи уже прошло, отменить её нельзя. Хотите записаться заново?
    expect: yes_no
    src: С-04

  # Проверка записи, С-05

  my_visits.one:
    text: "{patient}, вы записаны к {specialty:datv} {doctor:datv} {date}, {time}, кабинет {room}. Что-нибудь ещё?"
    expect: free
    src: С-05

  my_visits.many:
    text: "{patient}, у вас несколько записей: {options}. Про какую рассказать?"
    options: 2
    expect: choice
    src: С-05

  my_visits.third_party:
    text: Сведения о записях я могу сообщить только самому пациенту. Могу отправить SMS на номер пациента из карты.
    expect: yes_no
    src: С-05

  my_visits.sms_sent:
    text: Отправлено. Что-нибудь ещё?
    expect: free
    src: С-05

  # Вызов врача на дом, С-06

  home_visit.safety:
    text: Сначала важное. Если сейчас сильная боль в груди, трудно дышать или человек теряет сознание — звоните сто три.
    src: С-06

  home_visit.ask_address:
    text: "{patient}, назовите адрес, куда должен прийти врач."
    expect: free
    src: С-06

  home_visit.address_temporary:
    text: Это *временный* адрес?
    expect: yes_no
    src: С-06

  home_visit.ask_reason:
    text: Спасибо. Коротко скажите своими словами, что случилось. Я передам врачу.
    expect: free
    src: С-06

  home_visit.ask_can_come:
    text: Передам врачу. Вы можете сами прийти в поликлинику?
    expect: yes_no
    src: С-06

  home_visit.come_yourself:
    text: Тогда быстрее будет прийти на приём. Записать вас к терапевту на сегодня или завтра?
    expect: free
    src: С-06

  home_visit.accepted:
    text: Заявка принята на {date:short_accs}. Врач придёт до восемнадцати часов. Регистратор перезвонит при необходимости. Телефон для связи этот?
    expect: yes_no
    src: С-06

  home_visit.late:
    text: Заявки на сегодня уже не принимаются. Могу оформить вызов на {next_day:short_accs}. При ухудшении — кабинет неотложной помощи или сто три.
    expect: yes_no
    src: С-06

  home_visit.duplicate:
    text: Заявка на сегодня уже принята {time}. Врач придёт до восемнадцати часов.
    src: С-06

  home_visit.closed_day:
    text: В воскресенье и праздники заявки на дом не принимаются. При ухудшении звоните сто три.
    src: С-06

  home_visit.done:
    text: Хорошо. Если станет хуже — звоните сто три. Выздоравливайте!
    end: true
    src: С-06

  home_visit.no_assessment:
    text: Оценить, нужен ли визит, может только медицинский работник. Я оформлю заявку и передам ваши слова врачу.
    src: "6.3"

  # График работы, С-07

  schedule.doctor:
    text: "{doctor} принимает {days} с {start:gent} до {end:gent}, кабинет {room}. Записать вас?"
    expect: yes_no
    src: С-07

  schedule.specialty:
    text: "{specialty:plur} принимают {days}: {schedule}. Записать вас?"
    expect: yes_no
    src: С-07

  schedule.absent:
    text: "{doctor} не принимает до {date:gent}. Пациентов принимает {substitute}. Записать к {substitute:datv}?"
    expect: yes_no
    src: С-07

  schedule.not_found:
    text: Такого врача в расписании нет. Могу записать к другому врачу этой специальности.
    expect: yes_no
    src: С-07

  # Анализы, С-08

  labs.ready:
    text: "{test}: результат готов."
    src: С-08

  labs.pending:
    text: "{test}: результат будет {date}."
    src: С-08

  labs.how_to_get:
    text: Результаты есть на Госуслугах, в окне номер три с двенадцати до девятнадцати или у врача на приёме.
    src: С-08

  labs.values_refused:
    text: Значения анализов я не вижу и по телефону не сообщаю. Могу сообщить общий срок исследования.
    src: С-08

  labs.general_terms:
    text: Общий срок исследования указан в рабочих днях. Личную готовность результатов я не проверяю.
    src: '2.5; уточнение организаторов 15.10.2026 21:10'

  labs.ask_type:
    text: Какое именно исследование вас интересует?
    expect: free
    src: '2.5; уточнение организаторов 15.10.2026 21:10'

  labs.no_values:
    text: Я не вижу значений результатов и не могу их оценивать — это сделает врач. Записать вас к терапевту?
    expect: yes_no
    src: С-08

  labs.by_phone:
    text: По телефону результаты не сообщаются — это врачебная тайна. Они доступны на Госуслугах, в окне номер три или у врача.
    src: С-08

  labs.delayed:
    text: Результат задерживается. Я передам вопрос в лабораторию, вам перезвонят.
    route: R-08
    src: С-08

  labs.not_patient:
    text: Эти сведения я могу сообщить только самому пациенту.
    src: С-08

