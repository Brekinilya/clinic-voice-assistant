# Календарь исходящих напоминаний С-10.
# covered — период, за который праздники сверены. Вне его обзвон не идёт: день не считается
# рабочим молча, а исполнитель пишет в журнал, что календарь нужно дополнить.
# holidays — нерабочие праздничные дни внутри периода (производственный календарь РФ на 2026 год).
covered:
  from: 2026-10-01
  to: 2026-12-31
holidays:
  - 2026-11-04
  - 2026-12-31
