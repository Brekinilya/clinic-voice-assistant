# Сигналы, которые safety.check ищет в каждой реплике пациента вместе с красными флагами.
# Формат шаблонов — как в red_flags.yaml. Дополнительно:
#   short — шаблоны, которые засчитываются, только если фраза не длиннее трёх слов («Человека!»);
#   except — если совпал такой шаблон, сигнал не ставится;
#   negatives — фразы, на которых сигнал срабатывать не должен (проверяет тест).
# dental_acute и cant_cope — дополнение к контракту SafetyVerdict, нужны для правил R-09 и R-15.

window: 5

flags:
  operator:
    title: Просит соединить с сотрудником
    route: R-02
    src: 3.2, приложение А.2
    examples: [оператор, человек, живой, девушка, сотрудник, регистратура, соедините, Соедините с человеком, Позовите живого человека, Хочу поговорить с человеком]
    patterns:
      - оператор|сотрудник|регистратор
      - живой
      - соединить|соединять|переключить|переключать
      - позвать|дать|перевести|поговорить|говорить + человек|девушка|регистратура
      - человек + нужный|хотеть|надо
    # «Девушка, запишите…» — обращение, а не просьба; «регистратура» в длинной фразе — чаще жалоба (диалог 16)
    short:
      - человек|девушка|регистратура
    except:
      - соединить|соединять|переключить|перевести + платный|стоматология|стоматологический|зубной|администратор|администрация|неотложка|неотложный|главный|касса|лаборатория
    negatives:
      - Девушка, запишите меня к терапевту
      - Запишите меня, я пожилой человек
      - Соедините с платным отделением
      - Хочу пожаловаться на регистратуру

  complaint:
    title: Жалоба, недовольство, конфликт
    route: R-03
    src: С-15
    examples: [Хочу пожаловаться, Безобразие!, Врач нагрубил, Напишу в министерство, "Я уже третий день не могу к вам дозвониться, это безобразие!", Хочу пожаловаться на регистратуру]
    patterns:
      - жалоба|пожаловаться|жаловаться|претензия
      - безобразие|бардак|издевательство|возмутительно|отвратительно|хамство|позор
      - нагрубить|грубить|хамить|нахамить|наорать|хам|грубый
      - министерство|минздрав|прокуратура|прокурор|суд|росздравнадзор
      - не + дозвониться
    # «жалуюсь на боль» — про самочувствие, а не про поликлинику
    except:
      - жалоба|пожаловаться|жаловаться + боль|болеть|температура|кашель|давление|самочувствие|живот|голова|сердце|спина|горло
    negatives:
      - Хочу пожаловаться на боль в спине
      - Запишите к терапевту

  medical:
    title: Медицинский вопрос — лекарства, лечение, оценка анализов
    route: R-04
    src: 3.8, 6.9
    examples:
      - Что выпить от давления?
      - Нормальный ли у меня холестерин?
      - Что мне выпить от головной боли?
      - Какой у меня холестерин в последнем анализе?
      - Чем лечить кашель у ребёнка?
      - Можно ли с температурой выходить на работу?
      - Анализы хорошие?
      - Какие таблетки принимать от аллергии?
      - Это опасно?
    patterns:
      - что|чем|какой + выпить|пить|попить|принять|принимать|лечить|лечиться|сбить|сбивать|снизить|мазать|капать|полоскать|колоть
      - что|чем|какой + лекарство|препарат|таблетка|антибиотик|мазь|сироп
      - можно + выпить|пить|принять|принимать|температура|кашель|насморк|давление
      - какой|сколько + холестерин|сахар|гемоглобин|глюкоза|лейкоцит|давление
      - нормальный|норма + анализ|результат|холестерин|сахар|гемоглобин|показатель
      - хороший анализ|плохой анализ|анализ хороший|анализ плохой|хороший результат|плохой результат|результат хороший|результат плохой
      - это + опасно|опасный|страшно|страшный|серьезно|серьезный|нормально
      - диагноз
      - что + делать + если|при
    except:
      - опаздывать|опоздать|записаться|отменить|перенести|прикрепиться|дозвониться|полис
    negatives:
      - Что взять на приём?
      - Я опаздываю на приём, что делать?
      - Можно записаться через Госуслуги?
      - Запишите к врачу по сахару
      - Можно платно к кардиологу?
      - Какой кабинет?

  robot:
    title: Спрашивает, говорит ли с человеком
    src: 3.2
    examples: ["Вы робот?", "Это робот?", "Я с роботом говорю?", "Это автоответчик?", "С кем я говорю?", "Вы человек?"]
    patterns:
      - робот|бот|автоответчик|автомат|компьютер
      - с + кто + говорить|разговаривать
      - вы человек
    negatives:
      - Запишите человека к терапевту

  no_recording:
    title: Возражает против записи разговора
    src: 3.4
    examples: [Не записывайте, Я против записи, Я против записи разговора, Отключите запись, "Не хочу, чтобы разговор записывали", Не записывайте разговор]
    patterns:
      - против + запись|записывать
      - не + записывать|записать + разговор
      - не + хотеть + записывать
      - отключить|выключить|остановить|прекратить + запись|записывать
      - без + запись + разговор
    short:
      - не + записывать
    negatives:
      - Не записывайте меня на пятницу
      - Можно попасть без записи?
      - Уберите мою запись на пятницу
      - Отмените запись

  dental_acute:
    title: Острая зубная боль, травма зуба, отёк
    route: R-09
    src: R-09
    examples: [Сильно болит зуб, Острая зубная боль, Выбили зуб, Опухла щека, Флюс]
    patterns:
      - зуб|зубной + острый|сильный|сильно|невыносимо|невыносимый|ужасно|адский|нестерпимо
      - зуб + выбить|сломать|сломаться|отколоть|отколоться|травма
      - флюс
      - щека|десна + опухнуть|распухнуть|отек|отекать|раздуть
    negatives:
      - Запишите к зубному
      - Хочу запломбировать зуб

  cant_cope:
    title: Плохо слышит, не понимает, другой язык
    route: R-15
    src: R-15
    examples: [Я вас не понимаю, Ничего не понимаю, Я вас плохо слышу, Не слышу, Говорите громче, Я плохо говорю по-русски]
    patterns:
      - вы не понимать|не понимать вы
      - ничего не понимать|не понимать ничего
      - вы + плохо|не + слышать
      - громкий|громко
      - по-русски|русский + не|плохо
    # «плохо слышу на одно ухо» — жалоба для записи к лору, а не просьба о помощи в разговоре
    short:
      - не слышать|плохо слышать
    negatives:
      - Я не понимаю, как к вам прикрепиться
      - Мне нужно к врачу, плохо слышу на одно ухо
