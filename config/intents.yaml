# Каталог обращений по разделу 4 регламента и параметры, которые извлекает разбор фразы.
#
# mode: auto — ассистент доводит до результата сам; semi — собирает данные, решает сотрудник;
#       operator — перевод (route — правило из раздела 7.3); emergency — прерывает любой сценарий.
# stage — этап пилота из таблицы раздела 5. identify — нужна идентификация (раздел 3.5).
# slots — что может прийти в NluResult для этого интента; required — без чего действие не начать.
# Обращение к врачу по фамилии заполняет и specialty: специальность берётся из справочника врачей.
# I-11, I-12, I-13 параллельно ловит safety.check (флаги red_a, complaint, medical); флаг важнее интента.

intents:
  I-01:
    title: Запись на приём
    mode: auto
    scenarios: [С-01, С-02, С-12]
    stage: 1
    identify: true
    slots: [specialty, doctor, date_from, date_to, time_from, time_to, time_pref, exclude_weekdays, on_behalf]
    required: [specialty]
    examples:
      - Запишите к терапевту
      - Нужен талон к лору
      - Хочу к гинекологу на следующей неделе
      - Мне бы записаться к терапевту
      - Можно на приём к окулисту?
      - Хочу взять талончик к хирургу
      - Запишите меня к зубному на завтра
      - Мне к кардиологу нужно
      - У меня направление к неврологу
      - Нужно сделать УЗИ
      - Мне нужно записать дочку к педиатру
      - Запишите маму к эндокринологу
      - На когда есть номерок к дерматологу?
      - Хочу пройти диспансеризацию
      - Мне к лору, но лучше не в пятницу, после обеда

  I-02:
    title: Перенос записи
    mode: auto
    scenarios: [С-03]
    stage: 1
    identify: true
    slots: [visit_ref, specialty, doctor, date_from, date_to, time_from, time_to, time_pref, exclude_weekdays, on_behalf]
    required: []
    examples:
      - Не могу прийти в четверг, давайте на другой день
      - Перезапишите меня
      - Я записана на четверг, хочу перенести
      - Можно поменять время приёма?
      - Сдвиньте запись к окулисту попозже
      - Не успеваю к девяти, перенесите на вечер
      - Перенесите талон к лору на следующую неделю
      - Мне надо перенести запись к Кузнецовой

  I-03:
    title: Отмена записи
    mode: auto
    scenarios: [С-04]
    stage: 1
    identify: true
    slots: [visit_ref, on_behalf]
    required: []
    examples:
      - Отмените запись
      - Я не приду
      - Уже не нужно
      - Отмените, пожалуйста, запись к лору
      - Снимите мою запись на пятницу
      - Вычеркните меня, я выздоровел
      - Хочу отказаться от талона к хирургу
      - Отмените мою запись

  I-04:
    title: Проверка своей записи
    mode: auto
    scenarios: [С-05]
    stage: 1
    identify: true
    slots: [visit_ref, on_behalf]
    required: []
    examples:
      - На когда я записан?
      - Во сколько мне к врачу?
      - Какой кабинет?
      - Подскажите, на какое время я записан к окулисту
      - Я забыла, когда у меня приём у терапевта
      - Есть у меня запись на этой неделе?
      - На когда записана Смирнова Ольга, двенадцатое марта семьдесят восьмого?

  I-05:
    title: Вызов врача на дом
    mode: semi
    scenarios: [С-06]
    stage: 2
    identify: true
    slots: [on_behalf]
    required: []
    examples:
      - Вызвать врача на дом
      - Ребёнок заболел, нужен педиатр домой
      - Мне нужно вызвать врача на дом
      - Пусть терапевт придёт к маме, она не выходит из дома
      - Как вызвать врача на дом?
      - Температура со вчерашнего дня, нужен врач на дом

  I-06:
    title: График врача или поликлиники
    mode: auto
    scenarios: [С-07]
    stage: 1
    identify: false
    slots: [specialty, doctor, date_from, date_to]
    required: []
    examples:
      - Когда принимает Кузнецова?
      - До скольки вы работаете?
      - Работаете в субботу?
      - Когда принимает хирург?
      - Работает ли сегодня хирург?
      - В какие дни принимает лор?
      - Во сколько открывается поликлиника?
      - В каком кабинете принимает Лебедев?

  I-07:
    title: Готовность анализов
    mode: auto
    scenarios: [С-08]
    stage: 2
    identify: true
    slots: [date_from, date_to, on_behalf]
    required: []
    examples:
      - Готовы ли мои анализы?
      - Пришли результаты крови?
      - Хотела узнать, готовы ли анализы крови
      - Когда будут анализы?
      - Анализы пришли?
      - Сдавал кровь в понедельник, результаты уже есть?

  I-08:
    title: Платные услуги
    mode: auto
    # Услуги нет в справочнике, ДМС, договоры, медкомиссии — перевод в платное отделение.
    route: R-10
    scenarios: [С-09]
    stage: 2
    identify: false
    slots: [service, specialty, date_from, date_to, time_from, time_to]
    required: [service]
    examples:
      - Сколько стоит УЗИ?
      - Можно платно к кардиологу?
      - Сколько у вас стоит УЗИ щитовидки?
      - Хочу без направления, за деньги
      - Сколько стоит справка для бассейна?
      - Работаете по ДМС?
      - Сколько стоит медкомиссия на права?

  I-09:
    title: Лист ожидания
    mode: auto
    scenarios: [С-11]
    stage: 2
    identify: true
    slots: [specialty, doctor, date_from, date_to, time_from, time_to, exclude_weekdays]
    required: [specialty]
    examples:
      - Нет талонов — запишите в очередь
      - Позвоните, когда появится время
      - Поставьте меня в лист ожидания к неврологу
      - Если кто-то откажется от записи, позвоните мне

  I-10:
    title: Прикрепление, полис, документы и общие справки
    mode: auto
    # Оформление полиса — R-13, справки по стоимости — I-08, график — I-06.
    scenarios: [С-13]
    stage: 2
    identify: false
    slots: []
    required: []
    examples:
      - Как прикрепиться?
      - Что взять на приём?
      - Нужна справка в бассейн
      - Я недавно переехал, как к вам прикрепиться?
      - У меня полис другого региона
      - Как получить больничный?
      - Как сдать анализы?
      - Можно попасть без записи?
      - Можно записаться через Госуслуги?
      - Как получить новый полис?

  I-11:
    title: Экстренная ситуация
    mode: emergency
    route: R-01
    scenarios: [С-14]
    stage: 1
    identify: false
    slots: []
    required: []
    examples:
      - Боль в груди
      - Не может дышать
      - Потерял сознание
      - Мужу плохо, говорит, давит в груди, весь бледный
      - Ребёнок посинел
      - У отца перекосило лицо и отнялась рука
      - Мама упала и не приходит в себя
      - Не хочу жить

  I-12:
    title: Жалоба, конфликт
    description: Сюда же благодарность врачу — её принимают по сценарию С-15 с кодом GRATITUDE.
    mode: operator
    route: R-03
    scenarios: [С-15]
    stage: 1
    identify: false
    slots: []
    required: []
    examples:
      - Хочу пожаловаться
      - Безобразие!
      - Врач нагрубил
      - Я уже третий день не могу к вам дозвониться, это безобразие!
      - Напишу в министерство
      - Хочу пожаловаться на регистратуру

  I-13:
    title: Медицинский вопрос
    description: Симптомы, лечение, лекарства, значения анализов. Сначала граничная фраза (раздел 3.8), перевод — если пациент настаивает.
    mode: operator
    route: R-04
    scenarios: []
    stage: 1
    identify: false
    slots: [specialty]
    required: []
    examples:
      - Что выпить от давления?
      - Нормальный ли у меня холестерин?
      - Что мне выпить от головной боли?
      - Какой у меня холестерин в последнем анализе?
      - К какому врачу идти с болью в колене?
      - Можно ли с температурой выходить на работу?
      - Чем лечить кашель у ребёнка?
      - Нужно ли вызывать врача, если температура тридцать семь и пять?

  I-14:
    title: Прочее и нестандартное
    description: Запросы организаций (R-14), персональные данные (R-16), лекарственное обеспечение и другие медорганизации (R-12), всё вне каталога (R-08).
    mode: operator
    route: R-08
    scenarios: []
    stage: 1
    identify: false
    slots: []
    required: []
    examples:
      - Звоню из страховой компании по поводу пациента
      - Нужна выписка из медкарты
      - Это полиция, нужна информация о пациенте
      - Хочу отозвать согласие на обработку персональных данных
      - Где получить льготные лекарства?
      - Есть ли у вас вакцина от клещевого энцефалита?

# Короткие ответы на вопрос ассистента. Какой из них ждём — задаёт expect в запросе к разбору.
service_intents:
  "yes":
    title: Согласие
    examples: [да, "да, верно", ага, угу, конечно, давайте, хорошо, можно, подходит, правильно, записывайте, соединяйте]
  "no":
    title: Отказ
    examples: [нет, не надо, неверно, "нет, спасибо", не подходит, не нужно, это не она, ничего]
  choice:
    title: Выбор одного из предложенных вариантов
    examples: [первый, второй вариант, давайте пятницу, в десять тридцать, последний, "тот, что после обеда"]
  repeat:
    title: Просьба повторить
    examples: [повторите, "что?", не расслышал, "ещё раз, пожалуйста", "как вы сказали?"]
  maybe:
    title: Не уверен
    description: Ответ понят, но решения нет — в напоминании (С-10) статус записи не меняем.
    examples: [не знаю, может быть, постараюсь, пока не знаю, как получится]
  opt_out:
    title: Отказ от звонков
    description: Только в исходящем напоминании (С-10), код OPT_OUT.
    examples: [не звоните мне больше, не надо мне звонить, уберите мой номер из обзвона]
  unknown:
    title: Не понято
    description: Считается в правиле R-05 (2 раза — предложить оператора, 3 — перевести).
    examples: [э-э, м-м, ну это самое, алло]

slots:
  specialty:
    title: Специальность или кабинет
    type: specialty
    stage: 1
    note: Значение — название специальности из справочника врачей стенда в нижнем регистре.
  doctor:
    title: Фамилия врача, как её назвал пациент
    type: text
    stage: 1
  date_from:
    title: Начало желаемого периода
    type: date
    stage: 1
  date_to:
    title: Конец желаемого периода (включительно)
    type: date
    stage: 1
  time_from:
    title: Не раньше этого времени
    type: time
    stage: 1
  time_to:
    title: Не позже этого времени
    type: time
    stage: 1
  time_pref:
    title: Пораньше или попозже (приложение А.3)
    type: enum
    values: [early, late]
    stage: 1
  exclude_weekdays:
    title: Неудобные дни недели, 1 — понедельник
    type: weekday_list
    stage: 1
  choice_index:
    title: Номер выбранного варианта, с единицы
    type: int
    stage: 1
  last_name:
    title: Фамилия пациента
    type: text
    stage: 1
  first_name:
    title: Имя пациента
    type: text
    stage: 1
  middle_name:
    title: Отчество пациента
    type: text
    stage: 1
  birth_date:
    title: Дата рождения пациента
    type: date
    stage: 1
  visit_ref:
    title: Какую из существующих записей имеет в виду пациент
    type: visit_ref
    stage: 1
    note: Признаки старой записи (specialty, doctor, date, time), а не желаемой новой.
  on_behalf:
    title: Для кого обращение
    type: enum
    values: [self, child, other]
    stage: 1
    note: other — взрослый родственник или посторонний; сведения о записях ему не сообщаются (раздел 3.5).
  service:
    title: Платная услуга из прайс-листа
    type: text
    stage: 2
  policy_number:
    title: Номер полиса ОМС, 16 цифр
    type: digits
    stage: 1
    note: На стенде полиса нет; по регламенту — третий шаг идентификации.

# Примеры к параметрам. Дата звонка — как в примерах регламента: среда, 30 сентября 2026.
# Они же — заготовка тестов для локальных разборщиков.
slot_examples:
  reference_date: "2026-09-30"
  cases:
    - say: к лору
      slots: {specialty: оториноларинголог}
    - say: к окулисту
      slots: {specialty: офтальмолог}
    - say: к зубному
      slots: {specialty: стоматолог}
    - say: в женскую консультацию
      slots: {specialty: акушер-гинеколог}
    - say: к своему врачу
      slots: {specialty: терапевт}
    - say: детский врач
      slots: {specialty: педиатр}
    - say: к кожнику
      slots: {specialty: дерматовенеролог}
    - say: к Кузнецовой
      slots: {doctor: Кузнецова}
    - say: завтра
      slots: {date_from: "2026-10-01", date_to: "2026-10-01"}
    - say: послезавтра
      slots: {date_from: "2026-10-02", date_to: "2026-10-02"}
    - say: сегодня
      slots: {date_from: "2026-09-30", date_to: "2026-09-30"}
    - say: в понедельник
      slots: {date_from: "2026-10-05", date_to: "2026-10-05"}
    - say: в пятницу
      slots: {date_from: "2026-10-02", date_to: "2026-10-02"}
    # Сегодняшний день недели — следующая неделя; ассистент всё равно переспросит дату.
    - say: в среду
      slots: {date_from: "2026-10-07", date_to: "2026-10-07"}
    - say: на этой неделе
      slots: {date_from: "2026-09-30", date_to: "2026-10-04"}
    - say: на следующей неделе
      slots: {date_from: "2026-10-05", date_to: "2026-10-11"}
    - say: через неделю
      slots: {date_from: "2026-10-07", date_to: "2026-10-07"}
    - say: после выходных
      slots: {date_from: "2026-10-05", date_to: "2026-10-05"}
    - say: пятого октября
      slots: {date_from: "2026-10-05", date_to: "2026-10-05"}
    - say: с утра
      slots: {time_from: "07:30", time_to: "12:00"}
    - say: днём
      slots: {time_from: "12:00", time_to: "16:00"}
    - say: после обеда
      slots: {time_from: "12:00", time_to: "16:00"}
    - say: вечером
      slots: {time_from: "16:00", time_to: "20:00"}
    - say: после трёх
      slots: {time_from: "15:00"}
    - say: до одиннадцати
      slots: {time_to: "11:00"}
    - say: часов в десять утра
      slots: {time_from: "10:00", time_to: "10:00"}
    - say: пораньше
      slots: {time_pref: early}
    - say: попозже
      slots: {time_pref: late}
    - say: лучше не в пятницу, после обеда
      slots: {exclude_weekdays: [5], time_from: "12:00", time_to: "16:00"}
    - say: в любой день, кроме понедельника
      slots: {exclude_weekdays: [1]}
    - say: Смирнова Ольга Викторовна, двенадцатое марта семьдесят восьмого
      slots: {last_name: Смирнова, first_name: Ольга, middle_name: Викторовна, birth_date: "1978-03-12"}
    - say: Ольга Викторовна Смирнова
      slots: {last_name: Смирнова, first_name: Ольга, middle_name: Викторовна}
    - say: Иванов Сергей, третье января девяностого
      slots: {last_name: Иванов, first_name: Сергей, birth_date: "1990-01-03"}
    - say: 12.03.78
      slots: {birth_date: "1978-03-12"}
    - say: двенадцать ноль три семьдесят восемь
      slots: {birth_date: "1978-03-12"}
    - say: седьмое апреля две тысячи девятнадцатого
      slots: {birth_date: "2019-04-07"}
    - say: двадцатое июля пятьдесят пятого
      slots: {birth_date: "1955-07-20"}
    - say: запись на четверг
      slots: {visit_ref: {date: "2026-10-01"}}
    - say: к Кузнецовой в четверг
      slots: {visit_ref: {doctor: Кузнецова, date: "2026-10-01"}}
    - say: записать дочку
      slots: {on_behalf: child}
    - say: запишите маму
      slots: {on_behalf: other}
    - say: на когда записана Смирнова Ольга
      slots: {on_behalf: other}
    - say: УЗИ щитовидки
      slots: {service: УЗИ щитовидной железы}
    - say: один два три четыре, пять шесть семь восемь, девять ноль один два, три четыре пять шесть
      slots: {policy_number: "1234567890123456"}

# Выбор из предложенных вариантов: варианты — в том порядке, как их назвал ассистент.
choice_examples:
  - options: ["2026-10-02 15:15", "2026-10-05 16:00"]
    cases:
      - {say: давайте пятницу, choice_index: 1}
      - {say: второй, choice_index: 2}
      - {say: в понедельник, choice_index: 2}
      - {say: последний, choice_index: 2}
      - {say: который в пятнадцать пятнадцать, choice_index: 1}
  - options: ["2026-10-05 09:15", "2026-10-06 12:00", "2026-10-07 16:30"]
    cases:
      - {say: вторник, choice_index: 2}
      - {say: первый вариант, choice_index: 1}
      - {say: давайте в среду, choice_index: 3}
      - {say: где двенадцать ноль-ноль, choice_index: 2}
