# Фразы для замера распознавания и синтеза.
# patient — что говорит пациент: эталон для распознавания и ожидаемый результат разбора
#   (expect и slots — как в parse_expected, flags — что должен найти safety.check).
# assistant — реплики ассистента из примеров регламента, уже словами: для синтеза.
# Дата звонка для разбора — среда, 30.09.2026, как в примерах регламента.

reference_date: "2026-09-30"

patient:
  - id: p01
    text: Смирнова Ольга Викторовна, двенадцатое марта семьдесят восьмого
    expect: full_name
    slots: {last_name: Смирнова, first_name: Ольга, middle_name: Викторовна, birth_date: "1978-03-12"}
  - id: p02
    text: Иванов Сергей Петрович, третье января девяностого
    expect: full_name
    slots: {last_name: Иванов, first_name: Сергей, middle_name: Петрович, birth_date: "1990-01-03"}
  - id: p03
    text: Петров Игорь Николаевич, пятое мая шестьдесят второго
    expect: full_name
    slots: {last_name: Петров, first_name: Игорь, middle_name: Николаевич, birth_date: "1962-05-05"}
  - id: p04
    text: Кузьмина Нина Андреевна, двадцатое июля пятьдесят пятого
    expect: full_name
    slots: {last_name: Кузьмина, first_name: Нина, middle_name: Андреевна, birth_date: "1955-07-20"}
  - id: p05
    text: Соколов Андрей Викторович, девятое февраля восемьдесят пятого
    expect: full_name
    slots: {last_name: Соколов, first_name: Андрей, middle_name: Викторович, birth_date: "1985-02-09"}
  - id: p06
    text: Орлова Мария Ивановна, четырнадцатое ноября восемьдесят восьмого
    expect: full_name
    slots: {last_name: Орлова, first_name: Мария, middle_name: Ивановна, birth_date: "1988-11-14"}
  - id: p07
    text: Смирнова Алиса Дмитриевна, седьмое апреля две тысячи девятнадцатого
    expect: full_name
    slots: {last_name: Смирнова, first_name: Алиса, middle_name: Дмитриевна, birth_date: "2019-04-07"}
  - id: p08
    text: Фёдорова Наталья Юрьевна, тридцать первое декабря шестьдесят девятого
    expect: full_name
    slots: {last_name: Фёдорова, first_name: Наталья, middle_name: Юрьевна, birth_date: "1969-12-31"}
  - id: p09
    text: Цой Виктор Робертович, двадцать первое июня шестьдесят второго
    expect: full_name
    slots: {last_name: Цой, first_name: Виктор, middle_name: Робертович, birth_date: "1962-06-21"}
  - id: p10
    text: Шевчук Елена Богдановна, второе октября две тысячи первого
    expect: full_name
    slots: {last_name: Шевчук, first_name: Елена, middle_name: Богдановна, birth_date: "2001-10-02"}
  - id: p11
    text: Мне бы записаться к терапевту
    expect: free
    slots: {specialty: терапевт}
  - id: p12
    text: Мне к лору, но лучше не в пятницу, после обеда
    expect: free
    slots: {specialty: оториноларинголог, exclude_weekdays: [5], time_from: "12:00", time_to: "16:00"}
  - id: p13
    text: Запишите к окулисту на следующей неделе с утра
    expect: free
    slots: {specialty: офтальмолог, date_from: "2026-10-05", date_to: "2026-10-11", time_from: "07:30", time_to: "12:00"}
  - id: p14
    text: Хочу к гинекологу на пятое октября после трёх
    expect: free
    slots: {specialty: акушер-гинеколог, date_from: "2026-10-05", date_to: "2026-10-05", time_from: "15:00"}
  - id: p15
    text: Запишите к Кузнецовой на пятницу в десять тридцать
    expect: free
    slots: {doctor: Кузнецова, date_from: "2026-10-02", date_to: "2026-10-02", time_from: "10:30", time_to: "10:30"}
  - id: p16
    text: Отмените, пожалуйста, запись к лору
    expect: free
    slots: {specialty: оториноларинголог}
  - id: p17
    text: Я записана на четверг, хочу перенести
    expect: free
    slots: {date_from: "2026-10-01", date_to: "2026-10-01"}
  - id: p18
    text: Давайте в понедельник в шестнадцать ноль-ноль
    expect: date_time
    slots: {date_from: "2026-10-05", date_to: "2026-10-05", time_from: "16:00", time_to: "16:00"}
  - id: p19
    text: Да, верно
    expect: yes_no
    intent: "yes"
  - id: p20
    text: Нет, спасибо
    expect: yes_no
    intent: "no"
  - id: p21
    text: Повторите, пожалуйста
    expect: yes_no
    intent: repeat
  - id: p22
    text: Второй вариант
  - id: p23
    text: Соедините с человеком
    flags: [operator]
  - id: p24
    text: У меня сильно давит в груди
    flags: [red_a]
  - id: p25
    text: Он не может дышать, задыхается
    flags: [red_a]
  - id: p26
    text: Что мне выпить от головной боли?
    flags: [medical]
  - id: p27
    text: Вы робот?
    flags: [robot]
  - id: p28
    text: Я против записи разговора
    flags: [no_recording]
  - id: p29
    text: Хочу пожаловаться на регистратуру
    flags: [complaint]
  - id: p30
    text: Номер полиса один два три четыре пять шесть семь восемь девять ноль один два три четыре пять шесть
    digits: "1234567890123456"

assistant:
  - id: a01
    text: Здравствуйте! Регистратура поликлиники номер семь, виртуальный помощник. Разговор записывается. Чем могу помочь?
  - id: a02
    text: Назовите, пожалуйста, фамилию, имя, отчество и дату рождения.
  - id: a03
    text: Ольга Викторовна, к терапевту Кузнецовой есть время завтра в восемь сорок пять или в пятницу в десять тридцать. Что удобнее?
  - id: a04
    text: "Записываю: терапевт Кузнецова, пятница, второе октября, пятнадцать пятнадцать, кабинет двести четырнадцать. Верно?"
  - id: a05
    text: Готово, вы записаны. SMS придёт на ваш номер, накануне напомним. Возьмите паспорт и полис. Что-нибудь ещё?
  - id: a06
    text: Игорь Николаевич, вижу ваше направление к кардиологу. Ближайшее время во вторник, шестого октября, в одиннадцать двадцать.
  - id: a07
    text: Переношу на вторник, шестое октября, двенадцать ноль-ноль, кабинет двести четырнадцать. Запись на четверг отменяю. Верно?
  - id: a08
    text: Сергей Петрович, у вас запись к лору в пятницу в десять сорок. Могу перенести вместо отмены. Перенести или отменить?
  - id: a09
    text: Нина Андреевна, вы записаны к офтальмологу Лебедеву в понедельник, пятого октября, в тринадцать двадцать, кабинет сто восемнадцать.
  - id: a10
    text: Немедленно звоните в скорую — сто три или сто двенадцать. Повторяю — сто три или сто двенадцать. Не ждите приёма в поликлинике.
  - id: a11
    text: Медицинские советы может дать только врач. Если резко ухудшилось — звоните сто три. Записать вас к терапевту?
  - id: a12
    text: Да, я виртуальный помощник регистратуры. Если хотите, соединю с сотрудником.
  - id: a13
    text: Мне жаль, что так вышло. Соединяю вас со старшим администратором — суть обращения уже передана, повторять не придётся.
  - id: a14
    text: Здравствуйте! Это виртуальный помощник поликлиники номер семь, разговор записывается. Я говорю с Ольгой Викторовной?
  - id: a15
    text: Напоминаю, у вас запись к терапевту Кузнецовой завтра, в четверг, в восемь сорок пять, кабинет двести четырнадцать. Вы придёте?
  - id: a16
    text: Здравствуйте, это поликлиника номер семь. Пожалуйста, перезвоните в регистратуру по номеру семьсот, ноль семь, ноль семь.
  - id: a17
    text: Одну секунду, проверяю расписание.
